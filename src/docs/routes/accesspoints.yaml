# swagger/routes/accesspoints.yaml

/api/{tenant}/accesspoints:
  get:
    tags:
      - Access Points
    summary: List the access points of a tenant
    description: |
      Returns all access points of the tenant. Requires `readAny` on
      `manageBookables`.

      Scan codes are server knowledge and never part of a response.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
    responses:
      "200":
        description: All access points of the tenant
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ManagedAccessPoint"
      "401":
        description: Not authenticated
      "403":
        description: Not allowed to read access points
  put:
    tags:
      - Access Points
    summary: Create or update an access point
    description: |
      Upserts an access point. An `id` in the body updates that access point,
      a body without `id` creates a new one with a server-side id and a fresh
      scan code.

      Reserved for tenant owners (membership `owner: true`; instance owners are
      allowed as well). `tenantId` and `scanCode` are not writable - the tenant
      comes from the path, the scan code is only replaced by rotating it.

      Fields that are omitted keep their current value; on create they fall back
      to their default, and `provider` has to be part of the body.
      `validationRules` therefore distinguishes an omitted field from an
      explicitly empty list: omitting it on create requires a QR scan -
      except at a provider whose doors open from the list, `open-locker`,
      where it requires none -, submitting `[]` means no evidence is
      required.

      A validation rule may require other fields of the access point (a geo
      rule would need `location`). Those preconditions are checked against the
      state this request would leave behind, so a rule and the field it needs
      can be submitted together; an unmet precondition is answered with a
      `precondition_failed` validation error.

      `mode` is checked against what the provider reports for the access point
      behind `provider` and `externalId`: hardware without a remote capability
      cannot be put into `remote`, which is answered with an `unsupported_mode`
      validation error carrying the offending `mode` and the `supportedModes`
      the provider reports. Like the preconditions, this is checked against the
      state this request would leave behind, so pointing the access point at
      other hardware is judged by the new one. A provider that reports no
      supported modes does not restrict the mode. A Salto KS access point
      (`salto-ks`) is refused with `unsupported_mode` for any mode but
      `remote`, without asking Salto, so also while the listing is not
      available.

      `config.openAction` - the Öffnungsart of a Nuki access point - is checked
      against the same listing: a word outside
      `auto | unlock | unlatch | lock_n_go | lock_n_go_unlatch` is answered with
      an `unknown_open_action` validation error carrying the offending
      `openAction`, one the device type cannot carry out (`lock_n_go` at an
      opener, say) with an `unsupported_open_action` validation error carrying
      `openAction`, the Nuki `deviceType` (0-5) and the `supportedOpenActions`
      of that device type. Both name `config.openAction` as their field. Like
      the mode, this is checked against the state this request would leave
      behind. A missing key means `auto` and is never refused, `auto` is stored
      as sent rather than normalised away, and an access point the provider
      does not list is not restricted.

      An Open Locker compartment (`open-locker`) is checked against the same
      listing, which names only the compartments the tenant's technical
      account holds a permission on: a compartment it does not name is
      answered with a `compartment_not_accessible` validation error at
      `externalId`, carrying the `externalId`. So no compartment is stored
      that the account cannot open - also when an existing one is saved
      again after Open Locker took the permission away. A compartment
      without `externalId` is refused with a `required` validation error at
      `externalId`, without asking Open Locker, so also while the listing is
      not available.

      An Open Locker locker system (`type: locker`, mode `remote`) carries
      its own compartments in `config.compartments` and needs no
      `externalId`; without the list it is refused with `required` at
      `config.compartments`, in another mode with `unsupported_mode`. Each
      compartment named by its `id` (the UUID) is stored with `number` and
      `lockerBank` (`id`, `name`) from the listing, whatever the request
      says, and its `outOfService` as sent; one the listing does not name is
      refused with `compartment_not_accessible` at
      `config.compartments.<i>`, carrying `compartmentId`. While the tenant's
      Open Locker application is not active the compartments are stored as
      the request names them. One compartment stands in at most one locker
      system and is then no fixed compartment, across all access points of
      the tenant: a compartment another locker system holds is refused with
      `compartment_in_locker_system`, a fixed compartment with
      `compartment_is_fixed`, both at `config.compartments.<i>` with
      `compartmentId` and the holder's `accessPointId` and `label`; a fixed
      compartment a locker system holds is refused with
      `compartment_in_locker_system` at `externalId`. A compartment named
      twice is refused with `duplicate_compartment`, a list on the locker of
      a provider that assigns the compartment itself with
      `unsupported_by_provider` at `config.compartments`.

      A compartment that leaves the assignment of a locker system with the
      save - removed from its list, or `outOfService` now and in service
      before - moves the future bookings at it: those whose access window
      (period with the bookable's access buffer) has not begun, unpaid ones
      included, get the first free compartment in service of the locker
      system. Running bookings keep theirs. The locker system is stored and
      the bookings moved under its mutex; a mutex held too long is answered
      with `503 locker_system_busy` and nothing is stored. The answer of an
      update of a locker system carries `unmovedBookings`: the future
      bookings no compartment was free for, which stay at the old one. Read
      the bookings at the compartments beforehand with
      `GET /api/{tenant}/accesspoints/{id}/compartment-bookings`.

      `location` is checked like the location of a bookable or an event
      (glossary „Standort“): a new or changed location with an address, a
      display text or an addition needs a point, a point alone is enough, and
      the known fields must have their form (see `AccessPointLocation`); a
      refusal names its field, e.g. `location.coordinates`. A location the
      same as the stored one, also one left out of the body, passes as it
      was stored, even without a point.

      `provider` has to be one the platform has registered (the access
      providers it ships with); any other is answered with an
      `unknown_provider` validation error carrying the offending `provider`,
      field `provider`. Like the other
      checks, this is checked against the state this request would leave
      behind, so an existing access point with such a provider is refused as
      soon as it is saved again. Whether the tenant has switched the provider
      on does not matter here.

      The provider's listing is fetched once per save. While the tenant has no
      active application for the provider, there is no listing: the access
      point is stored unchecked - an Open Locker compartment too -, and the
      checks that need the listing run on the first save once the provider
      is active. A provider that cannot be asked is answered as such and nothing
      is stored: an HTTP 401 or 403
      from the provider (token rejected) is a `502 access_provider_rejected`,
      a network error, timeout or 5xx a `503 access_provider_unreachable`,
      both with `params.provider`. The checks themselves stay `400`.

      An `id` the tenant does not know is answered with 404 instead of being
      created, so ids always come from the server.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccessPointWrite"
    responses:
      "200":
        description: |
          The updated access point; for a locker system that carries its own
          compartments, with `unmovedBookings`
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ManagedAccessPoint"
                - type: object
                  properties:
                    unmovedBookings:
                      type: array
                      description: |
                        The future bookings at a compartment leaving the
                        assignment that no free compartment was found for;
                        they stay at it. Only for a locker system that
                        carries its own compartments.
                      items:
                        $ref: "#/components/schemas/CompartmentBooking"
      "201":
        description: The created access point
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedAccessPoint"
      "400":
        description: The submitted access point is invalid
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationErrorResponse"
      "401":
        description: Not authenticated
      "403":
        description: Not a tenant owner
      "404":
        description: The tenant has no access point with the submitted `id`
      "502":
        description: |
          The provider rejected the request for its listing (HTTP 401 or 403
          from the provider, i.e. its token is invalid or refused). Nothing
          was stored.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessProviderRejected"
      "503":
        description: |
          The provider could not be reached for its listing (network error,
          timeout or a 5xx from the provider). Nothing was stored.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessProviderUnreachable"

/api/{tenant}/accesspoints/{id}:
  get:
    tags:
      - Access Points
    summary: Get a single access point
    description: |
      Returns one access point of the tenant. Requires `readAny` on
      `manageBookables`.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the access point
        schema:
          type: string
    responses:
      "200":
        description: The access point
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedAccessPoint"
      "401":
        description: Not authenticated
      "403":
        description: Not allowed to read access points
      "404":
        description: The tenant has no access point with that id
  delete:
    tags:
      - Access Points
    summary: Delete an access point
    description: |
      Deletes the access point and removes its id from the
      `accessPointDetails.accessPointIds` of every bookable of the tenant, so no
      bookable is left pointing at an access point that no longer exists.

      Reserved for tenant owners (membership `owner: true`; instance owners are
      allowed as well).

      The access log keeps its entries: they document what happened at a door
      that once existed, and may therefore reference a deleted access point.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the access point
        schema:
          type: string
    responses:
      "200":
        description: The access point was deleted and detached from all bookables
      "401":
        description: Not authenticated
      "403":
        description: Not a tenant owner
      "404":
        description: The tenant has no access point with that id

/api/{tenant}/accesspoints/{id}/bookings:
  get:
    tags:
      - Access Points
    summary: List the bookings that hold a live access at an access point
    description: |
      Returns the bookings of the tenant that currently hold a granted,
      unrevoked access at this access point, so an administration can see what
      a deletion would tear up: `DELETE /api/{tenant}/accesspoints/{id}`
      detaches the access point from the bookables and drops the row, but it
      revokes nothing at the provider.

      A booking counts when it carries an entry at this access point that is
      provisioned and not revoked, its period has not passed (a booking
      without an end never ends) and it is not rejected. "Provisioned", not
      "has a grant": a door in mode `remote` is marked provisioned without a
      grant object, while a compartment that is only held is not provisioned
      yet. A booking is named once, however many compartments it holds at a
      locker system.

      Requires `readAny` on `manageBookings` - the answer names bookings and
      their customers, so it is the booking reader's right and not the one
      that carries the access point list. Tenant owners, who alone may delete
      an access point, are covered by that.

      An administrative warning, not a booking export: each hit carries the
      booking id, the customer's name and mail address and the period, nothing
      further. The list names at most ten bookings, the ones already running
      first, and `total` counts all of them. The cap is not a parameter - a
      caller who could raise it would be asking for a booking export.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the access point
        schema:
          type: string
    responses:
      "200":
        description: The bookings with a live access at this access point
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessPointBookings"
      "401":
        description: Not authenticated
      "403":
        description: Not allowed to read the bookings of the tenant
      "404":
        description: The tenant has no access point with that id

/api/{tenant}/accesspoints/{id}/compartment-bookings:
  get:
    tags:
      - Access Points
    summary: List the running and future bookings at compartments of a locker system
    description: |
      Returns the bookings of the tenant at the given compartments of this
      locker system, for the administration to see before it takes them out
      of service or out of the locker system with
      `PUT /api/{tenant}/accesspoints`. A booking counts when it holds one of
      the compartments in an entry at this locker system that is not taken
      back, is not rejected, cancelled or withdrawn, and its access window
      (period with the bookable's access buffer) is not over. It is
      `running` once the access window has begun - it keeps its compartment
      on the save - and `future` before - it moves. A booking without a
      period is running.

      Requires `readAny` on `manageBookings`, like the booking list of an
      access point. The list names at most ten, earliest first, one per
      compartment held; `total` counts all of them.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the locker system
        schema:
          type: string
      - name: compartmentIds
        in: query
        required: true
        description: UUIDs of the compartments, comma-separated or repeated
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
    responses:
      "200":
        description: The running and future bookings at the compartments
        content:
          application/json:
            schema:
              type: object
              properties:
                total:
                  type: integer
                  example: 3
                bookings:
                  type: array
                  items:
                    allOf:
                      - $ref: "#/components/schemas/CompartmentBooking"
                      - type: object
                        properties:
                          state:
                            type: string
                            enum: [running, future]
              required:
                - total
                - bookings
      "401":
        description: Not authenticated
      "403":
        description: Not allowed to read the bookings of the tenant
      "404":
        description: The tenant has no access point with that id

/api/{tenant}/accesspoints/{id}/qrcode:
  get:
    tags:
      - Access Points
    summary: Render the QR code of an access point
    description: |
      Renders the printable QR code of the access point. The code encodes the
      store-front scan URL `https://<STORE_FRONT_URL>/mobile-key/<tenant>/<scanCode>`;
      the URL schema and the scan code inside stay server knowledge, the client
      only ever receives the rendered image or PDF.

      Reserved for tenant owners (membership `owner: true`; instance owners are
      allowed as well).

      `format=pdf` returns an A4 print template (label, QR code and a short
      instruction) rendered through the PDF service.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the access point
        schema:
          type: string
      - name: format
        in: query
        required: false
        description: The render format. Defaults to `svg`.
        schema:
          type: string
          enum: [svg, png, pdf]
          default: svg
    responses:
      "200":
        description: The rendered QR code
        content:
          image/svg+xml:
            schema:
              type: string
          image/png:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      "400":
        description: Unsupported format
      "401":
        description: Not authenticated
      "403":
        description: Not a tenant owner
      "404":
        description: |
          The tenant has no access point with that id, or it is a locker
          system with its own list of compartments: only its compartments
          have QR codes
      "503":
        description: |
          `store_front_url_missing`: the instance has no `STORE_FRONT_URL`, so
          there is no address to encode. A configuration of the instance, not a
          failure of the request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreFrontUrlMissing"

/api/{tenant}/accesspoints/{id}/compartments/{compartmentId}/qrcode:
  get:
    tags:
      - Access Points
    summary: Render the QR code of one Fach of a locker system
    description: |
      Renders the printable QR code of one compartment (Fach) of a locker
      system that carries its own list of compartments (Open Locker),
      addressed by the locker system and the compartment's UUID. The code
      encodes `https://<STORE_FRONT_URL>/mobile-key/<tenant>/<scanCode>` with
      the compartment's own scan code, never the locker system's; the client
      only ever receives the rendered image or PDF. A compartment out of
      service is rendered as well, its code stays valid.

      Reserved for tenant owners (membership `owner: true`; instance owners are
      allowed as well), like the door's QR code.

      `format=pdf` returns the door's A4 print template with the locker
      system's label and „Schrank X · Fach N“ above the code. The file is
      named `qr-<locker system>-schrank-<locker bank>-fach-<nn>.<format>`
      (labels as ASCII slugs, the number at least two digits) in
      `Content-Disposition`.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the locker system
        schema:
          type: string
      - name: compartmentId
        in: path
        required: true
        description: UUID of the compartment, its `id` in `config.compartments`
        schema:
          type: string
      - name: format
        in: query
        required: false
        description: The render format. Defaults to `svg`.
        schema:
          type: string
          enum: [svg, png, pdf]
          default: svg
    responses:
      "200":
        description: The rendered QR code
        headers:
          Content-Disposition:
            description: |
              `inline; filename="qr-<locker system>-schrank-<locker bank>-fach-<nn>.<format>"`
            schema:
              type: string
        content:
          image/svg+xml:
            schema:
              type: string
          image/png:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      "400":
        description: Unsupported format
      "401":
        description: Not authenticated
      "403":
        description: Not a tenant owner
      "404":
        description: |
          The tenant has no access point with that id, it is a door or a locker
          system without its own list of compartments (iFBS, Pareva), or it
          carries no compartment with that UUID
      "503":
        description: |
          `store_front_url_missing`: the instance has no `STORE_FRONT_URL`, so
          there is no address to encode.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreFrontUrlMissing"

/api/{tenant}/accesspoints/{id}/compartments/qrcodes:
  get:
    tags:
      - Access Points
    summary: Render the Sammel-PDF of all Fächer of a locker system
    description: |
      Renders the QR codes of all compartments (Fächer) of a locker system that
      carries its own list of compartments (Open Locker) as one PDF, the
      Sammel-PDF: an Etikettenbogen of 2×4 labels of 105 × 74 mm (A7) on a
      borderless A4 sheet (e.g. Zweckform 3427), with thin dashed cut lines for
      plain paper. Each label carries the locker system's label, „Schrank X“,
      the compartment's own QR code (52 mm), „FACH“ with its number and
      „Scannen, um Ihr Fach zu öffnen“. Every locker bank (Schrank) starts a
      new page; the order is that of the allocation: locker bank by name (by id
      for the same name), then compartment number, numerically. Compartments
      out of service are printed with the note „außer Betrieb“, their codes
      stay valid.

      Reserved for tenant owners (membership `owner: true`; instance owners are
      allowed as well), like the door's QR code.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the locker system
        schema:
          type: string
    responses:
      "200":
        description: The Sammel-PDF
        headers:
          Content-Disposition:
            description: |
              `inline; filename="qr-<locker system>-alle-faecher.pdf"` (the
              label as ASCII slug)
            schema:
              type: string
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      "401":
        description: Not authenticated
      "403":
        description: Not a tenant owner
      "404":
        description: |
          The tenant has no access point with that id, or it is a door or a
          locker system without its own list of compartments (iFBS, Pareva)
      "503":
        description: |
          `store_front_url_missing`: the instance has no `STORE_FRONT_URL`, so
          there is no address to encode.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreFrontUrlMissing"

/api/{tenant}/accesspoints/{id}/location-prefill:
  get:
    tags:
      - Access Points
    summary: Suggest the location of an access point from its provider
    description: |
      Asks the access provider where the physical lock stands, so the location
      does not have to be typed in when the provider already knows it.

      The endpoint writes nothing: the suggestion is only adopted when it is
      submitted back as `location` through the `PUT`, which keeps the access
      point the single source of its location. There is no sync field and no
      background reconciliation.

      Reserved for tenant owners (membership `owner: true`; instance owners are
      allowed as well).

      `getLocation` is an optional provider capability. Which providers offer it
      is part of `providerCapabilities` in `GET /api/{tenant}/access-apps/providers`,
      so a client can tell up front whether a prefill is worth offering.

      NUKI answers with coordinates and no address, since its API has none.
      Salto KS does not offer the capability - its Connect API carries no geo
      data - and answers `null`, as does every other provider without the
      capability and every lock the provider knows no position for.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the access point
        schema:
          type: string
    responses:
      "200":
        description: |
          The suggested location, or `null` when the provider knows none. The
          access point itself is unchanged.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AccessPointLocation"
              nullable: true
            examples:
              coordinates:
                summary: A NUKI lock with coordinates
                value:
                  coordinates:
                    type: Point
                    points: [7.1, 51.2]
              unknown:
                summary: A provider without geo data
                value: null
      "401":
        description: Not authenticated
      "403":
        description: Not a tenant owner
      "404":
        description: The tenant has no access point with that id

/api/{tenant}/accesspoints/{id}/rotate-scan-code:
  post:
    tags:
      - Access Points
    summary: Rotate the scan code of an access point
    description: |
      Retires the current scan code - it is pushed to the front of the
      access point's `previousScanCodes` (capped at five, the oldest fall off) -
      and mints a new opaque, url-safe, per-tenant scan code. Old stickers stop
      resolving at once; in-flight opens are unaffected because access points are
      resolved per request. Rotation is the revocation mechanism, a reprint is
      simply rotate, then fetch the QR code again.

      Reserved for tenant owners (membership `owner: true`; instance owners are
      allowed as well).

      The response carries neither the old nor the new scan code - both stay
      server knowledge.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the access point
        schema:
          type: string
    responses:
      "200":
        description: The access point after rotation, without any scan codes
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedAccessPoint"
      "401":
        description: Not authenticated
      "403":
        description: Not a tenant owner
      "404":
        description: |
          The tenant has no access point with that id, or it is a locker
          system with its own list of compartments: only the codes of its
          compartments are rotated

/api/{tenant}/accesspoints/{id}/compartments/{compartmentId}/rotate-scan-code:
  post:
    tags:
      - Access Points
    summary: Rotate the scan code of one Fach of a locker system
    description: |
      Rotates the scan code of one compartment (Fach) of a locker system that
      carries its own list of compartments (Open Locker), addressed by the
      locker system and the compartment's UUID, by the door's rule: the
      current code is pushed to the front of the compartment's
      `previousScanCodes` (capped at five, the oldest fall off) and a new
      one takes its place. The old sticker resolves as stale
      (`stale_scan_code`) from then on. The other compartments and the
      locker system's own code stay as they are.

      Runs under the mutex of the locker system, which every save of it holds
      as well, so a concurrent save never writes the old code back.

      Reserved for tenant owners (membership `owner: true`; instance owners are
      allowed as well), like the door's rotation.

      The response carries neither the old nor the new scan code.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the locker system
        schema:
          type: string
      - name: compartmentId
        in: path
        required: true
        description: UUID of the compartment at Open Locker
        schema:
          type: string
    responses:
      "200":
        description: The locker system after rotation, without any scan codes
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedAccessPoint"
      "401":
        description: Not authenticated
      "403":
        description: Not a tenant owner
      "404":
        description: |
          The tenant has no access point with that id, it is a door or a
          locker system without its own list of compartments (iFBS, Pareva),
          or the locker system carries no compartment with that UUID
      "503":
        description: The locker system stayed held (`locker_system_busy`)

/api/{tenant}/accesspoints/{id}/compartments/rotate-scan-codes:
  post:
    tags:
      - Access Points
    summary: Rotate the scan codes of all Fächer of a locker system
    description: |
      Rotates the scan code of every compartment (Fach) of a locker system
      that carries its own list of compartments (Open Locker), out of service
      included, each by the rule of one compartment: the current code is
      pushed to the front of the compartment's `previousScanCodes` (capped at
      five, the oldest fall off) and a new one takes its place. The locker
      system is stored once. Every printed sticker resolves as stale
      (`stale_scan_code`) from then on. The locker system's own code stays as
      it is.

      Runs under the mutex of the locker system, which every save of it holds
      as well, so a concurrent save never writes the old codes back.

      Reserved for tenant owners (membership `owner: true`; instance owners are
      allowed as well), like the door's rotation.

      The response carries neither the old nor the new scan codes.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the locker system
        schema:
          type: string
    responses:
      "200":
        description: The locker system after rotation, without any scan codes
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedAccessPoint"
      "401":
        description: Not authenticated
      "403":
        description: Not a tenant owner
      "404":
        description: |
          The tenant has no access point with that id, or it is a door or a
          locker system without its own list of compartments (iFBS, Pareva)
      "503":
        description: The locker system stayed held (`locker_system_busy`)

/api/{tenant}/accesspoints/{id}/bookables:
  put:
    tags:
      - Access Points
    summary: Set the bookables of an access point
    description: |
      Sets which bookables carry the access point (glossary "Zuordnung"),
      as the access points page assigns it. The body lists every bookable
      that shall carry it: the access point's id is added to
      `accessPointDetails.accessPointIds` of each listed bookable that lacks
      it and removed from each other bookable of the tenant that carries
      it. A bookable that gets its first access point has its access
      switched on (`accessPointDetails.active: true`), so the assignment
      takes effect at once; one that loses its last keeps `active` as it
      is. Nothing else of a bookable changes - the assignment is the same
      the bookable's own section shows and saves with `PUT bookables`.

      Requires `update` on `manageBookables` at every bookable that changes,
      with the reach of `PUT /api/{tenant}/bookables`: with `updateOwn`
      alone the bookables the user owns. A bookable that does not change is
      not asked about, so a list that keeps a bookable out of reach goes
      through. A Schließfachanlage with its own Fächer (Open Locker) hangs at
      one bookable at most.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        description: Unique identifier of the access point
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - bookableIds
            properties:
              bookableIds:
                type: array
                description: |
                  Every bookable that shall carry the access point; an empty
                  list removes it from all of them
                items:
                  type: string
                example: [b-saal, b-foyer]
    responses:
      "200":
        description: The access point and the bookables that carry it now
        content:
          application/json:
            schema:
              type: object
              properties:
                accessPointId:
                  type: string
                  example: ap-1
                bookableIds:
                  type: array
                  items:
                    type: string
                  example: [b-saal, b-foyer]
      "400":
        description: |
          `invalid_bookable_ids` - `bookableIds` is no list of ids.
          `unknown_bookable` - the tenant has no bookable of that id
          (`params.bookableId`). `locker_system_one_bookable` - a
          Schließfachanlage with its own Fächer is to hang at more than one
          bookable (`params.accessPointId`, `params.label`). Nothing is
          stored.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationErrorResponse"
      "401":
        description: Not authenticated
      "403":
        description: |
          No `update` on `manageBookables`, or a bookable that would change
          lies out of the user's reach; nothing is stored. The one JSON form
          of the central error handler (`ForbiddenError`, code `forbidden`).
      "404":
        description: |
          `access_point_not_found` - the tenant has no access point with
          that id

components:
  schemas:
    AccessPointBookings:
      type: object
      description: |
        The bookings with a live access at an access point: `total` counts all
        of them, `bookings` names at most ten, by start time.
      properties:
        total:
          type: integer
          description: How many bookings hold a live access at the access point
          example: 23
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/AccessPointBooking"
      required:
        - total
        - bookings

    AccessPointBooking:
      type: object
      description: |
        One booking with a live access, in the little the warning needs to
        name it.
      properties:
        id:
          type: string
          example: "1699999999999-abc"
        name:
          type: string
          nullable: true
          description: The customer's name
          example: Erika Muster
        mail:
          type: string
          nullable: true
          description: The customer's mail address
          example: erika@example.org
        timeBegin:
          type: number
          nullable: true
          description: Start of the booking period, in epoch milliseconds
          example: 1700000000000
        timeEnd:
          type: number
          nullable: true
          description: End of the booking period, in epoch milliseconds
          example: 1700003600000

    CompartmentBooking:
      type: object
      description: |
        A booking at a compartment of a locker system, in the little the
        administration needs to name it, with the compartment it holds.
      allOf:
        - $ref: "#/components/schemas/AccessPointBooking"
      properties:
        compartment:
          type: object
          properties:
            id:
              type: string
              description: UUID of the compartment
            number:
              type: integer
              nullable: true
            lockerBank:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                name:
                  type: string

    AccessPointOpenAction:
      type: string
      enum: [auto, unlock, unlatch, lock_n_go, lock_n_go_unlatch]
      description: |
        Öffnungsart: what the door does when the access point is opened.
        Provider `nuki` only - every other provider ignores the key.

        `auto` lets the platform choose by device type, as it always has:
        pull the latch where there is one, unlock where there is not, open
        the door at an opener. `unlock` throws the bolt back and leaves the
        door shut, `unlatch` additionally pulls the latch, `lock_n_go`
        unlocks, waits and locks again, `lock_n_go_unlatch` does that and
        pulls the latch.

        A missing key means `auto`; an explicit `auto` is stored as sent. An
        explicit value is refused on write unless the device can carry it
        out, so a stored one is always doable.
      example: unlatch

    ManagedAccessPoint:
      type: object
      description: |
        A physical access point of a tenant. `scanCode` and `previousScanCodes`
        are persisted but never returned.
      properties:
        id:
          type: string
          example: "6f1c0f6e-6f0f-4d0e-9f0a-2b1c9d4e5f60"
        tenantId:
          type: string
          example: "demo"
        type:
          type: string
          enum: [door, locker]
          description: |
            `door`: shared, configured once, opened by whoever books a
            bookable that references it. `locker`: a locker system - an
            iFBS location or a Pareva product - whose provider assigns a
            compartment per booking; `externalId` is the location or size,
            `providerLocationId` the iFBS location or the Pareva locker
            system. An Open Locker locker system instead carries its own
            compartments (`config.compartments`) and the platform assigns
            them. Capacity is the bookable's `amount`, never the row's.
          example: door
        provider:
          type: string
          description: Access provider of the physical lock
          example: nuki
        externalId:
          type: string
          description: Identifier of the lock at the provider
          example: "lock-123"
        providerLocationId:
          type: string
          nullable: true
          description: NUKI account id or Salto site id the lock belongs to
          example: "site-1"
        label:
          type: string
          example: Haupteingang
        mode:
          type: string
          enum: [remote, authorization, both]
          description: How the physical lock can be operated
          example: authorization
        config:
          type: object
          description: Provider-specific configuration
          properties:
            openAction:
              $ref: "#/components/schemas/AccessPointOpenAction"
            compartments:
              type: array
              description: |
                The compartments of an Open Locker locker system, in their
                stored order. Only on a `locker` whose provider lets it carry
                its own list.
              items:
                $ref: "#/components/schemas/LockerSystemCompartment"
          additionalProperties: true
        location:
          allOf:
            - $ref: "#/components/schemas/AccessPointLocation"
          nullable: true
        validationRules:
          type: array
          description: |
            Evidence a client has to provide when opening this access point, on
            top of the fixed booking checks. All rules have to be fulfilled.
          items:
            $ref: "#/components/schemas/AccessPointValidationRule"

    AccessPointWrite:
      type: object
      description: |
        Writable access point fields. `id` decides between update and create.
      properties:
        id:
          type: string
          description: |
            Identifier of the access point to update. Omit it to create a new
            access point.
        label:
          type: string
        type:
          type: string
          enum: [door, locker]
        provider:
          type: string
        externalId:
          type: string
        providerLocationId:
          type: string
          nullable: true
        mode:
          type: string
          enum: [remote, authorization, both]
        config:
          type: object
          properties:
            openAction:
              $ref: "#/components/schemas/AccessPointOpenAction"
            compartments:
              type: array
              description: |
                The compartments of an Open Locker locker system, in their
                stored order. Only on a `locker` whose provider lets it carry
                its own list.
              items:
                $ref: "#/components/schemas/LockerSystemCompartment"
          additionalProperties: true
        location:
          allOf:
            - $ref: "#/components/schemas/AccessPointLocation"
          nullable: true
        validationRules:
          type: array
          items:
            $ref: "#/components/schemas/AccessPointValidationRule"

    LockerSystemCompartment:
      type: object
      description: |
        A compartment of a locker system that carries its own list. On write
        only `id` and `outOfService` count while the provider is active;
        `number` and `lockerBank` are taken from its listing. Each compartment
        carries a scan code of its own, minted by the server when it joins
        the list and kept while it stays in it, out of service included; a
        scan code in the request is ignored, and no answer carries one.
      required: [id]
      properties:
        id:
          type: string
          description: UUID of the compartment at Open Locker
          example: "9b2f6c1e-3d4a-4f5b-8c7d-1e2f3a4b5c6d"
        number:
          type: integer
          nullable: true
          example: 1
        lockerBank:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
              example: Labor Fachbank 1
        outOfService:
          type: boolean
          description: Taken out of the assignment by hand
          default: false

    AccessPointLocation:
      type: object
      description: |
        Where the access point physically is, in the same shape as
        `bookable.location`. Coordinates without an address are allowed, an
        address, `display_address` or `meta.additional` without coordinates
        only when unchanged from the stored location. `points` is
        `[longitude, latitude]` as numbers within ±180 and ±90, or
        `[null, null]` for no point; `meta.source` is `photon`, `manual` or
        `nuki` (an old stored value such as `nominatim` or `legacy` may stay);
        `address.country_code` has two letters, empty only in an empty
        location or as stored. Unknown fields are kept unchecked.
      properties:
        coordinates:
          type: object
          properties:
            type:
              type: string
              example: Point
            points:
              type: array
              description: Longitude and latitude
              items:
                type: number
              example: [7.1, 51.2]
        display_address:
          type: string
        address:
          type: object
          properties:
            street:
              type: string
              nullable: true
            house_number:
              type: string
              nullable: true
            postcode:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
            suburb:
              type: string
              nullable: true
            state:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
            country_code:
              type: string
              nullable: true
        meta:
          type: object
          additionalProperties: true

    AccessPointValidationRule:
      type: object
      description: |
        An evidence requirement of an access point. `qrScan` requires the person
        opening the door to present the code printed on it and has no
        precondition of its own.
      properties:
        type:
          type: string
          enum: [qrScan]
          example: qrScan
      required:
        - type

    StoreFrontUrlMissing:
      type: object
      description: |
        The body of a 503 answer of the QR code route: the instance has no
        `STORE_FRONT_URL`, so the scan address cannot be built.
      properties:
        error:
          type: string
          example: BaseError
        code:
          type: string
          example: store_front_url_missing
        statusCode:
          type: integer
          example: 503
        params:
          type: object

    AccessProviderRejected:
      type: object
      description: |
        The body of a 502 answer: the access provider rejected the platform's
        request for its listing while an access point was saved.
      properties:
        error:
          type: string
          example: BaseError
        code:
          type: string
          example: access_provider_rejected
        statusCode:
          type: integer
          example: 502
        params:
          type: object
          properties:
            provider:
              type: string
              description: The access provider that rejected the request
              example: nuki

    AccessProviderUnreachable:
      type: object
      description: |
        The body of a 503 answer: the access provider could not be reached
        for its listing while an access point was saved.
      properties:
        error:
          type: string
          example: BaseError
        code:
          type: string
          example: access_provider_unreachable
        statusCode:
          type: integer
          example: 503
        params:
          type: object
          properties:
            provider:
              type: string
              description: The access provider that could not be reached
              example: nuki

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: ValidationError
        message:
          type: string
          example: validation_failed
        statusCode:
          type: integer
          example: 400
        details:
          type: array
          items:
            type: object
            description: |
              One rejected field. `code: "precondition_failed"` on
              `validationRules` means a rule cannot be used on this access
              point; `params` then names the rule (`ruleType`) and the fields it
              needs (`requires`).
            properties:
              field:
                type: string
                example: validationRules
              code:
                type: string
                example: precondition_failed
              params:
                type: object
                additionalProperties: true
                example: { ruleType: geoFence, requires: [location] }
