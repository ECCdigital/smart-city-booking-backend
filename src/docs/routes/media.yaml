# swagger/routes/media.yaml

/api/v2/{tenant}/media:
  post:
    tags:
      - Media
    summary: Upload a file into the media library
    description: |
      Uploads exactly one file per request. The bytes go to the configured
      storage provider, the metadata becomes a medium. Uploading requires
      `manageMedia.create`; the uploader becomes the owner of the medium.

      The type is decided from the content (magic bytes plus an image decode),
      never from the file name: JPEG, PNG, WebP, GIF, SVG, ICO and PDF are
      accepted. ICO is let in by its magic bytes alone and gets no variants —
      sharp cannot read it.
      Uploads are limited per kind (images 15 MB, documents 50 MB by default).
      Image uploads generate their variants synchronously — if one of them
      fails, the whole upload fails and no medium is created.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
              name:
                type: string
                description: Title of the medium, defaults to the file name
              altText:
                type: string
              tags:
                type: string
                description: Comma separated list or JSON array
                example: summer,beach
              visibility:
                type: string
                enum: [public, intern]
    responses:
      "201":
        description: The created medium
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Media"
      "400":
        description: |
          Missing file, more than one file, invalid metadata, a type outside the
          allowlist (`unsupported_file_type`), a file above its limit
          (`file_too_large`), an undecodable image (`invalid_image`) or a
          variant that could not be rendered (`image_processing_failed`).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaApiError"
      "401":
        description: Not authenticated
      "403":
        description: No `manageMedia.create` permission in this tenant
      "413":
        description: |
          Above the global upload backstop of the instance, which sits above
          every media limit.
      "503":
        description: The storage provider could not be reached

  get:
    tags:
      - Media
    summary: List media of a tenant
    description: |
      Paginated and filtered listing — the backend of the media picker, and
      therefore gated by the picker right: `manageMedia.readAny` shows the whole
      library of the tenant, `manageMedia.readOwn` only the caller's own
      uploads. Booking documents never appear here.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: page
        in: query
        description: 1-based page number
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        description: Page size, capped at 100
        schema:
          type: integer
          default: 25
      - name: kind
        in: query
        schema:
          type: string
          enum: [image, document]
      - name: tag
        in: query
        schema:
          type: string
      - name: q
        in: query
        description: Free-text filter on title, alt text and file name
        schema:
          type: string
      - name: visibility
        in: query
        schema:
          type: string
          enum: [public, intern]
    responses:
      "200":
        description: A page of media
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaList"
      "400":
        description: Invalid filter value
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaApiError"
      "401":
        description: Not authenticated
      "403":
        description: No media read permission in this tenant

/api/v2/{tenant}/media/{id}:
  get:
    tags:
      - Media
    summary: Metadata of a medium
    description: |
      Reading metadata is part of the media library and needs the picker right
      (`manageMedia.readAny`, or `manageMedia.readOwn` for one's own uploads).
      Booking documents follow the receipt rule instead: whoever may read any
      booking of the tenant, or the owner of the booking itself.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/MediaIdParam"
    responses:
      "200":
        description: The medium
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Media"
      "401":
        description: Not authenticated
      "403":
        description: No media read permission, or no access to the booking
      "404":
        description: No such medium in this tenant

  patch:
    tags:
      - Media
    summary: Change the metadata of a medium
    description: |
      Only title, alt text, tags and visibility can change — the file of a
      medium is immutable, replacing it means uploading a new medium.

      Needs `manageMedia.updateAny`, or `manageMedia.updateOwn` for one's own
      uploads. The metadata of a booking document follows the update rights of
      its booking instead, and a `visibility` sent for one is ignored — access
      to a booking document follows the booking alone.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/MediaIdParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MediaPatch"
    responses:
      "200":
        description: The updated medium
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Media"
      "400":
        description: No updatable field was sent, or an invalid value
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaApiError"
      "401":
        description: Not authenticated
      "403":
        description: No media update permission, or no access to the booking
      "404":
        description: No such medium in this tenant

  delete:
    tags:
      - Media
    summary: Delete a medium
    description: |
      A medium in use cannot be deleted: the usage proof is searched first and
      a non-empty one answers `409` with exactly the body of
      `/media/{id}/usage`. Otherwise the database document goes first and the
      bytes best-effort afterwards. Deleting is final — there is no trash.
      Needs `manageMedia.deleteAny`, or `manageMedia.deleteOwn` for one's own
      uploads.

      Booking documents cannot be deleted through the API
      (`booking_document_not_deletable`); they only cascade with their
      bookings — the medium goes with the last booking that references it.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/MediaIdParam"
    responses:
      "204":
        description: The medium was deleted
      "401":
        description: Not authenticated
      "403":
        description: No media delete permission, or a booking document
      "404":
        description: No such medium in this tenant
      "409":
        description: |
          The medium is still in use. The body is the usage proof itself,
          identical to `GET /media/{id}/usage`.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUsage"

/api/v2/{tenant}/media/{id}/usage:
  get:
    tags:
      - Media
    summary: Usage proof of a medium
    description: |
      Where a medium is referenced — bookable images and attachments, the
      teaser image, contact person image, image list and speaker photos of an
      event and its attachments, booking attachments, instance branding and
      legal documents. The search runs on
      demand over those reference sites; a medium never carries a back
      reference, so the answer can never go stale.

      Read like the metadata: `manageMedia.readAny`, or `manageMedia.readOwn`
      for one's own uploads. Booking documents follow the receipt rule.

      An empty array means the medium can be deleted; the same list blocks a
      `DELETE` with `409`.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/MediaIdParam"
    responses:
      "200":
        description: The usage sites of the medium
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUsage"
      "401":
        description: Not authenticated
      "403":
        description: No media read permission, or no access to the booking
      "404":
        description: No such medium in this tenant

/api/v2/{tenant}/media/{id}/file:
  get:
    tags:
      - Media
    summary: Download the file of a medium
    description: |
      Streams the original, or the image variant a preset resolves to, through
      the backend — every read is permission checked, there are no presigned
      storage URLs.

      Unlike the metadata route, the binary follows the visibility of the
      medium: `public` is readable anonymously, `intern` needs an active
      membership in the owning tenant, no role required. Booking documents
      follow the receipt rule: whoever may read any booking of the tenant, or
      the owner of the booking itself — a customer gets their invoice without
      holding any role.

      `size` names a preset, never pixels. A preset without a matching variant
      degrades to the next larger one and finally to the original, so a preset
      choice never produces a 404. Originals of SVG media are served as a
      download; their variants are the rendered image.

      Caching follows the medium: a public original is immutable for a year, a
      public variant is cacheable for a day and revalidated against a strong
      ETag built from the variant checksum, an internal medium is
      `private, no-cache` with an ETag, and a booking document is never stored.
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/MediaIdParam"
      - name: size
        in: query
        description: |
          Image preset. Omit for the original. `thumb` is a 160×160 crop, the
          others bound the width without enlarging: 480, 800 and 1600 pixels.
        schema:
          type: string
          enum: [thumb, sm, md, lg]
    responses:
      "200":
        description: The file
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      "304":
        description: The client's copy still matches the ETag
      "400":
        description: Unknown preset name
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaApiError"
      "401":
        description: |
          An internal medium or a booking document was requested anonymously
      "403":
        description: |
          No active membership in the owning tenant, or no access to the booking
      "404":
        description: No such medium in this tenant
      "503":
        description: The storage provider could not be reached

/api/v2/instance/media:
  post:
    tags:
      - Media
    summary: Upload a file into the instance media library
    description: |
      The instance media library — media without a tenant, for instance-wide
      content such as branding and the legal documents. Same data model, same
      routes, addressed with `instance` where a tenant id would stand.

      Managing it belongs to the instance owner alone: there is no tenant whose
      roles could grant anything here. Uploads follow the same rules as a tenant
      upload, plus ICO for favicons — ICO is stored as uploaded and gets no
      variants.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
              name:
                type: string
                description: Title of the medium, defaults to the file name
              altText:
                type: string
              tags:
                type: string
                description: Comma separated list or JSON array
              visibility:
                type: string
                enum: [public, intern]
    responses:
      "201":
        description: The created medium, which carries no tenant
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Media"
      "400":
        description: |
          Missing file, more than one file, invalid metadata, a type outside the
          allowlist, or a file above its limit.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaApiError"
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner
      "413":
        description: Above the global upload backstop of the instance
      "503":
        description: The storage provider could not be reached

  get:
    tags:
      - Media
    summary: List the instance media
    description: |
      Paginated and filtered listing of the instance library — the backend of
      the instance media picker. Instance media and tenant media are strictly
      separated: no tenant medium ever appears here, and no instance medium in
      a tenant listing.
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: 1-based page number
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        description: Page size, capped at 100
        schema:
          type: integer
          default: 25
      - name: kind
        in: query
        schema:
          type: string
          enum: [image, document]
      - name: tag
        in: query
        schema:
          type: string
      - name: q
        in: query
        description: Free-text filter on title, alt text and file name
        schema:
          type: string
      - name: visibility
        in: query
        schema:
          type: string
          enum: [public, intern]
    responses:
      "200":
        description: A page of instance media
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaList"
      "400":
        description: Invalid filter value
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaApiError"
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner

/api/v2/instance/media/{id}:
  get:
    tags:
      - Media
    summary: Metadata of an instance medium
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/MediaIdParam"
    responses:
      "200":
        description: The medium
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Media"
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner
      "404":
        description: No such instance medium

  patch:
    tags:
      - Media
    summary: Change the metadata of an instance medium
    description: |
      Only title, alt text, tags and visibility can change — the file of a
      medium is immutable.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/MediaIdParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MediaPatch"
    responses:
      "200":
        description: The updated medium
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Media"
      "400":
        description: No updatable field was sent, or an invalid value
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaApiError"
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner
      "404":
        description: No such instance medium

  delete:
    tags:
      - Media
    summary: Delete an instance medium
    description: |
      Blocked while the medium is in use — the usage proof of the instance
      covers branding and the legal documents. Deleting is final.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/MediaIdParam"
    responses:
      "204":
        description: The medium was deleted
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner
      "404":
        description: No such instance medium
      "409":
        description: |
          The medium is still in use. The body is the usage proof itself.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUsage"

/api/v2/instance/media/{id}/usage:
  get:
    tags:
      - Media
    summary: Usage proof of an instance medium
    description: |
      Where the medium is referenced — the branding and the legal documents of
      the instance. An empty array means it can be deleted.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/MediaIdParam"
    responses:
      "200":
        description: The usage sites of the medium
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUsage"
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner
      "404":
        description: No such instance medium

/api/v2/instance/media/{id}/file:
  get:
    tags:
      - Media
    summary: Download the file of an instance medium
    description: |
      Like the tenant binary route, but with the instance reading of
      visibility: `public` is readable anonymously, and `intern` means any
      signed-in user of the instance — there is no tenant whose membership
      could narrow it further.

      `size` names a preset and degrades to the next larger variant and finally
      to the original, so a preset choice never produces a 404. ICO media have
      no variants and always answer with the original.
    parameters:
      - $ref: "#/components/parameters/MediaIdParam"
      - name: size
        in: query
        description: |
          Image preset. Omit for the original. `thumb` is a 160×160 crop, the
          others bound the width without enlarging: 480, 800 and 1600 pixels.
        schema:
          type: string
          enum: [thumb, sm, md, lg]
    responses:
      "200":
        description: The file
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      "304":
        description: The client's copy still matches the ETag
      "400":
        description: Unknown preset name
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaApiError"
      "401":
        description: An internal medium was requested anonymously
      "404":
        description: No such instance medium
      "503":
        description: The storage provider could not be reached

components:
  parameters:
    MediaIdParam:
      name: id
      in: path
      required: true
      description: Unique identifier of the medium
      schema:
        type: string
