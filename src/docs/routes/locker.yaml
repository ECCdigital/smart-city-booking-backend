# swagger/routes/locker.yaml
#
# The `/locker` routes of the admin UI, kept one release as a facade after
# the locker fold. Locker systems are access points of type `locker` now
# (see accesspoints.yaml), configured under `/accesspoints` and listed from
# the provider under `/access-apps/{provider}/access-points`; these routes
# answer the same things under the old paths until the admin UI moves.

/api/{tenant}/locker/{provider}/locations:
  get:
    tags:
      - Locker (facade)
    deprecated: true
    summary: List the locker systems the provider offers
    description: |
      The access points the provider lists for the tenant - the iFBS
      locations, the Pareva sizes - as `GET /access-apps/{provider}/access-points`
      answers them. The provider's own record of each is its `metadata`.
      Requires the `MANAGE_BOOKABLES` read permission.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/LockerProviderParam"
    responses:
      "200":
        description: The listed access points of the provider
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ListedAccessPoint"
      "401":
        description: Not authenticated
      "403":
        description: Missing `MANAGE_BOOKABLES` permission
      "404":
        description: The tenant has no active application of the provider
      "500":
        description: Could not get locker locations

/api/{tenant}/locker/{provider}/locations/{locationId}:
  get:
    tags:
      - Locker (facade)
    deprecated: true
    summary: One locker system by its id
    description: |
      The listed access point whose `id` or `externalId` is `locationId`.
      Requires the `MANAGE_BOOKABLES` read permission.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/LockerProviderParam"
      - $ref: "#/components/parameters/LockerLocationIdParam"
    responses:
      "200":
        description: The listed access point
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListedAccessPoint"
      "401":
        description: Not authenticated
      "403":
        description: Missing `MANAGE_BOOKABLES` permission
      "404":
        description: The provider lists no such locker system, or the tenant has no active application of the provider
      "500":
        description: Could not get locker location

/api/{tenant}/locker/{provider}/locations/{locationId}/status:
  get:
    tags:
      - Locker (facade)
    deprecated: true
    summary: The status of a locker system
    description: |
      What the provider lists for the locker system, its own record under
      `metadata` - the same answer as the location itself. Requires the
      `MANAGE_BOOKABLES` read permission.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/LockerProviderParam"
      - $ref: "#/components/parameters/LockerLocationIdParam"
    responses:
      "200":
        description: The listed access point
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListedAccessPoint"
      "401":
        description: Not authenticated
      "403":
        description: Missing `MANAGE_BOOKABLES` permission
      "404":
        description: The provider lists no such locker system, or the tenant has no active application of the provider
      "500":
        description: Could not get locker location status

/api/{tenant}/locker/{provider}/locations/{locationId}/price:
  get:
    tags:
      - Locker (facade)
    deprecated: true
    summary: The price categories of a locker system
    description: |
      The external price categories the checkout price provider of the
      provider answers for the location - iFBS' tiers per minute, hour,
      day, week, month, year and its service fee. A provider that prices
      nothing through the checkout answers an empty list. Requires the
      `MANAGE_BOOKABLES` read permission.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/LockerProviderParam"
      - $ref: "#/components/parameters/LockerLocationIdParam"
    responses:
      "200":
        description: The price categories
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  priceEur:
                    type: number
                  unit:
                    type: string
                    example: hour
                  external:
                    type: boolean
                    example: true
      "400":
        description: No checkout price provider for this provider
      "401":
        description: Not authenticated
      "403":
        description: Missing `MANAGE_BOOKABLES` permission
      "500":
        description: Could not get locker pricing

/api/{tenant}/locker/{provider}/test:
  post:
    tags:
      - Locker (facade)
    deprecated: true
    summary: Test a locker provider configuration
    description: |
      Runs the provider's connection test with the configuration in the
      body, without storing it - the same test as
      `POST /access-apps/{provider}/test`, which is the tenant owner's;
      here the `MANAGE_BOOKABLES` read permission suffices, as it did.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/LockerProviderParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: |
              iFBS: `serverUrl`, `apiKey`. Pareva: `serverUrl`, `lockerId`,
              `user`, `password`.
            additionalProperties: true
    responses:
      "200":
        description: The test result
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
      "400":
        description: No test available for this provider
      "401":
        description: Not authenticated
      "403":
        description: Missing `MANAGE_BOOKABLES` permission
      "500":
        description: Could not test locker connection

components:
  parameters:
    LockerProviderParam:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [ifbs, pareva]
      description: The locker provider
    LockerLocationIdParam:
      name: locationId
      in: path
      required: true
      schema:
        type: string
      description: The iFBS location id or the Pareva size id

  schemas:
    ListedAccessPoint:
      type: object
      description: |
        An access point as the provider lists it for the tenant, before an
        administrator stores it. For a locker system: an iFBS location or a
        Pareva size.
      properties:
        id:
          type: string
          description: The provider's id of the access point
          example: "7"
        type:
          type: string
          enum: [door, locker]
        provider:
          type: string
          example: ifbs
        externalId:
          type: string
          example: "7"
        locationId:
          type: string
          nullable: true
          description: The iFBS location, or the Pareva locker system the size belongs to
        label:
          type: string
          example: Bahnhof
        capabilities:
          type: array
          items:
            type: string
            enum: [remote, authorization]
        supportedModes:
          type: array
          items:
            type: string
            enum: [remote, authorization, both]
        metadata:
          type: object
          description: The provider's own record of the access point
          additionalProperties: true

    BookableLockerDetails:
      type: object
      readOnly: true
      description: |
        `lockerDetails` of a bookable as the bookable routes answer it: read
        only, derived from the locker rows (`type: locker`) among the
        bookable's `accessPointDetails.accessPointIds`. A value sent in is
        ignored; locker systems are configured as access points.
      properties:
        active:
          type: boolean
          description: Whether the bookable's access points are switched on and a locker system is among them
        units:
          type: array
          items:
            type: object
            description: |
              An iFBS location `{ lockerSystem: "ifbs", locationId, amount }`
              or a size `{ id, lockerSystem, amount }`; `amount` is the
              bookable's.
            additionalProperties: true

    BookingLockerInfo:
      type: array
      readOnly: true
      description: |
        `lockerInfo` of a booking as the booking routes answer it: read
        only, one record per compartment, derived from the booking's
        `accessInfo` entries of type `locker`. A value sent in is ignored.
      items:
        type: object
        properties:
          id:
            type: string
            description: The iFBS location or the Pareva size
          lockerSystem:
            type: string
            enum: [ifbs, pareva]
          bookableId:
            type: string
            nullable: true
          isConfirmed:
            type: boolean
            description: Granted and not revoked
          processId:
            type: string
            nullable: true
            description: The grant's authorization id once confirmed
          ifbsMetadata:
            type: object
            description: iFBS only - `boxId`, `nummer`, `price`, `bookingId`
            additionalProperties: true
