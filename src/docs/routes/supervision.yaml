# swagger/routes/supervision.yaml
#
# The tenant supervision (glossary "Mandanten-Aufsicht"): the supervision
# level of a tenant, set by the instance owner alone, and the immutable
# supervision history. The level is also carried by the tenant DTOs:
# `supervisionLevel` and `supervisionChangedAt` in the admin DTO
# (`GET /api/tenants`, `GET /api/tenants/{tenant}`), `supervisionLevel` alone
# in the public one (`GET /api/tenants/public`, `?publicTenants=true`). Neither
# field is accepted by `POST /api/tenants` or `PUT /api/tenants`; both are
# dropped from the body.
#
# A blocked tenant has no public projection: it is left out of
# `GET /api/tenants/public` and the catalog bundle, its slug and theme answer
# 404, and every public offer path of the tenant (`/api/{tenant}/bookables/
# public*`, opening hours, availability, block periods, occupancy, prices,
# `/events*`, `/bookings?public=true`, `/calendar/occupancy`, coupon lookup,
# media files, iCal, the JSON and HTML engines, `/checkout/permissions/{id}`
# and `/api/tenants/{tenant}/payment-apps`) answers `404 tenant_not_found`
# under the public reach. Staff of the tenant keep their reach. A new
# self-booking of a blocked tenant is refused by every checkout entrance with
# the reason `checkout.offer_not_reachable`; the administration's manual
# booking, existing bookings, payment callbacks, hooks and webhooks are
# unaffected.
#
# The review of a bookable (glossary "Prüfstatus"): under `supervised` only
# an approved bookable passes the offer gate. List-type delivery
# (`/api/{tenant}/bookables/public`, `/calendar/occupancy` without `ids`, the
# JSON and HTML engines incl. related bookables and tickets) shows a bookable
# that asks to be listed (`isPublic`) and - under supervision - is approved.
# Detail-type delivery under the public reach (`/bookables/public/{id}`,
# `/bookables/{id}/prices|openingHours|availability*|block-periods|occupancy|
# bookings?public=true`, `/checkout/permissions/{id}` v1 and v2,
# `/calendar/occupancy?ids=`) follows the direct-link rule: `isPublic` is no
# requirement, under supervision the approval is; otherwise
# `404 offer_not_found`, naming no reason. Every checkout entrance refuses
# a new self-booking of such a bookable with `checkout.offer_not_reachable`.
#
# Events pass the same gate with their own review. List-type delivery:
# `GET /api/{tenant}/events`, the JSON engine (list and detail), the HTML
# engine's list, iCal and the iCal feeds (without `includePrivate`).
# Detail-type delivery: `GET /api/{tenant}/events/{id}`, the HTML engine's
# event detail, the event embedded by `?populate=true` in a public bookable,
# and everything about a ticket of the event - its detail, prices,
# availability, permission pre-check and every checkout entrance - which
# needs the ticket and its event reachable; the public bookable lists leave
# out the tickets of an event that is not. Under the public reach the
# event routes answer without `review`; whoever may read events
# (`manageBookables.readAny`, or `readOwn` for their own) gets them whole.

/api/{tenant}/bookables/{id}/review/submissions:
  post:
    tags:
      - Supervision
    summary: Submit a bookable for review
    description: |
      The submission (glossary "Einreichung"): a bookable without a review
      status or a rejected one becomes `pending` with a new `submittedAt`,
      with or without a publication wish and whatever the tenant's level.
      Takes no body; actor and time are the server's. Repeating it on a
      pending bookable is a no-op `200` (no new waiting time, no history
      row). Writes a `review.submitted` history row; records a
      `review.queueEntered` notification occasion only when the tenant is
      `supervised`. Tenant owner or instance owner. The first publication
      wish of a bookable without a review status (`PUT /api/{tenant}/bookables`
      with `isPublic: true`) submits it the same way.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: The current review.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferReviewAnswer"
      "401":
        description: Not authenticated
      "403":
        description: Neither the tenant owner nor the instance owner
      "404":
        description: "`offer_not_found`: the tenant has no such bookable."
      "409":
        description: |
          `review_transition_invalid` with `params: { from, action }`: an
          approved bookable cannot be submitted, or the status moved
          underneath the request.

/api/{tenant}/bookables/{id}/review/decisions:
  post:
    tags:
      - Supervision
    summary: Decide the review of a bookable
    description: |
      The decision (glossary "Prüfentscheidung") of the instance owner:
      `approve` a pending or rejected bookable, `reject` a pending one,
      `withdraw` an approval (→ `rejected`). The publication wish stays as
      it is. Writes a `review.approved|rejected|withdrawn` history row and
      records a `review.decided` notification occasion for the tenant owners.
      The write is conditional on the status the decision was taken on: of
      two concurrent decisions one answers `409`.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [action]
            properties:
              action:
                type: string
                enum: [approve, reject, withdraw]
              reason:
                type: string
                nullable: true
                description: Optional reason, stored trimmed with review and history.
    responses:
      "200":
        description: The new review.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferReviewAnswer"
      "400":
        description: "`invalid_review_action`, `invalid_review_reason`"
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner
      "404":
        description: "`offer_not_found`"
      "409":
        description: "`review_transition_invalid` with `params: { from, action }`"

/api/{tenant}/events/{id}/review/submissions:
  post:
    tags:
      - Supervision
    summary: Submit an event for review
    description: |
      As for a bookable (`/api/{tenant}/bookables/{id}/review/submissions`),
      with `offerType: "event"`: no body, a repeat on a pending event is a
      no-op `200`, a `review.submitted` history row, a `review.queueEntered`
      occasion only for a `supervised` tenant. The first publication wish of
      an event without a review status (`PUT /api/{tenant}/events` with
      `isPublic: true`) submits it the same way. The expiry of an event
      changes no status: a past event is submitted like any other.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: The current review.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferReviewAnswer"
      "401":
        description: Not authenticated
      "403":
        description: Neither the tenant owner nor the instance owner
      "404":
        description: "`offer_not_found`: the tenant has no such event."
      "409":
        description: "`review_transition_invalid` with `params: { from, action }`"

/api/{tenant}/events/{id}/review/decisions:
  post:
    tags:
      - Supervision
    summary: Decide the review of an event
    description: |
      As for a bookable (`/api/{tenant}/bookables/{id}/review/decisions`),
      with `offerType: "event"`. A pending event that has expired stays
      decidable.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [action]
            properties:
              action:
                type: string
                enum: [approve, reject, withdraw]
              reason:
                type: string
                nullable: true
                description: Optional reason, stored trimmed with review and history.
    responses:
      "200":
        description: The new review.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferReviewAnswer"
      "400":
        description: "`invalid_review_action`, `invalid_review_reason`"
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner
      "404":
        description: "`offer_not_found`"
      "409":
        description: "`review_transition_invalid` with `params: { from, action }`"

/api/tenants/{tenant}/supervision:
  put:
    tags:
      - Supervision
    summary: Set the supervision level of a tenant
    description: |
      Sets the level (glossary "Aufsichtsstufe") of the tenant. Instance
      owner only. Actor and time are the server's. The level that is already
      effective is a no-op: nothing is written, the stored change time is
      answered. A change writes one history row (`tenant.levelChanged`) and
      records one notification occasion for the tenant owners.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [level]
            properties:
              level:
                $ref: "#/components/schemas/SupervisionLevel"
              reason:
                type: string
                nullable: true
                description: Optional reason, stored with the history row.
    responses:
      "200":
        description: The effective level and when it last changed.
        content:
          application/json:
            schema:
              type: object
              properties:
                supervisionLevel:
                  $ref: "#/components/schemas/SupervisionLevel"
                supervisionChangedAt:
                  type: string
                  format: date-time
                  nullable: true
      "400":
        description: "`invalid_supervision_level`: a level outside the vocabulary."
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner
      "404":
        description: "`tenant_not_found`"
      "409":
        description: |
          `supervision_level_changed`: the level moved underneath the request;
          read the tenant again and repeat.

/api/tenants/{tenant}/supervision/history:
  get:
    tags:
      - Supervision
    summary: The supervision history of a tenant
    description: |
      The immutable history (glossary "Aufsichtshistorie") of the tenant and
      its offers, newest first. The tenant owner reads the tenant the route
      names, the instance owner every tenant.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/SupervisionHistoryPage"
      - $ref: "#/components/parameters/SupervisionHistoryPageSize"
      - $ref: "#/components/parameters/SupervisionHistoryOfferType"
      - $ref: "#/components/parameters/SupervisionHistoryOfferId"
    responses:
      "200":
        description: One page of the history.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupervisionHistoryPage"
      "400":
        description: "`invalid_offer_type`"
      "401":
        description: Not authenticated
      "403":
        description: Neither the tenant owner nor the instance owner

/api/instances/supervision/history:
  get:
    tags:
      - Supervision
    summary: The instance-wide supervision history
    description: |
      The history across every tenant, newest first, optionally narrowed to
      one tenant and one offer. Instance owner only.
    security:
      - bearerAuth: []
    parameters:
      - name: tenantId
        in: query
        required: false
        schema:
          type: string
      - $ref: "#/components/parameters/SupervisionHistoryPage"
      - $ref: "#/components/parameters/SupervisionHistoryPageSize"
      - $ref: "#/components/parameters/SupervisionHistoryOfferType"
      - $ref: "#/components/parameters/SupervisionHistoryOfferId"
    responses:
      "200":
        description: One page of the history.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupervisionHistoryPage"
      "400":
        description: "`invalid_offer_type`"
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner
