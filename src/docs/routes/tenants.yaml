# swagger/routes/tenants.yaml
#
# The tenant API is not documented here in full — only the legal documents a
# tenant files, since that is the part the media library added. Both operations
# accept and return the whole tenant; the bodies below name `legalDocuments`
# alone and leave the remaining tenant fields undocumented.

/api/tenants:
  post:
    tags:
      - Tenants
    summary: Create a tenant (the creation contract)
    description: |
      Opens a tenant for the caller, who becomes its owner (`Membership.owner`)
      and gets the default mail and PDF templates. Whom the instance lets
      create is the right `tenant.create` (instance owner, the Freigabeliste,
      or everyone when the instance says so); the global `MAX_TENANTS` holds
      for everyone. A Selbst-Anlage (glossary; the caller is not an instance
      owner) is proven once more on the server — the stored account needs the
      verification proof, for an SSO account the identity provider's — and
      counted: three successful self-creations per rolling 24 hours per user
      (`RATE_LIMIT_TENANT_SELF_CREATION_PER_USER`), a failed one not, a deleted
      tenant returns nothing. A new tenant starts at the server-side
      supervision level (`free` for the instance owner, else the instance's
      initial level); `supervisionLevel`/`supervisionChangedAt` in the body
      are dropped. The obsolete `PUT /api/tenants` with an unknown id follows
      the same contract.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, contactName, mail]
            properties:
              name:
                type: string
                example: Stadthalle
              contactName:
                type: string
                description: The contact person of the tenant
                example: Erika Muster
              mail:
                type: string
                format: email
                description: The formally valid contact address of the tenant (not the creator's account address)
                example: kontakt@stadthalle.example
              phone:
                type: string
              website:
                type: string
              location:
                type: string
              legalDocuments:
                $ref: "#/components/schemas/TenantLegalDocuments"
    responses:
      "201":
        description: The tenant exists; the body is empty — read it back with `GET /api/tenants`
      "400":
        description: |
          `missing_name`, `missing_contact_name` or `invalid_mail` (with
          `params.field`); or a media reference that may not be stored
          (`media_reference_unknown`, `media_reference_not_public`).
      "403":
        description: |
          No right to create (`forbidden`), or a Selbst-Anlage without
          verification proof: `email_verification_required` with
          `params.method` (`email` | `identity_provider`) and `params.provider`.
      "409":
        description: "`max_tenants_reached`: the global `MAX_TENANTS` is reached"
      "429":
        description: |
          `too_many_requests`: the caller's three self-creations of the last 24
          hours are spent; `Retry-After` (seconds) and `params.retryAfterSeconds`
          say when the next one is possible.

  put:
    tags:
      - Tenants
    summary: Store a tenant, legal documents included
    description: |
      Writes a tenant. `legalDocuments` has no endpoint of its own — it travels
      with the tenant like every other field, and is only stored when the
      payload carries it. Whoever saves has to own the tenant named by `id`, or
      the instance; the medium behind a document is checked after that, so a
      save can be refused for the reference rather than the tenant. The owner
      of a declined tenant is refused, the membership rests:
      `403 tenant_declined` (`TenantDeclinedError`).
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id:
                type: string
                example: tenant1
              legalDocuments:
                $ref: "#/components/schemas/TenantLegalDocuments"
    responses:
      "200":
        description: |
          An existing tenant was updated: the stored tenant, every document
          reference carrying the address it resolves to in `url`.
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                legalDocuments:
                  $ref: "#/components/schemas/TenantLegalDocuments"
      "201":
        description: |
          An unknown id created a tenant instead — for the instance owner, who
          alone owns a tenant that does not exist yet; everyone else opens a
          tenant with `POST /api/tenants`. The creation follows the contract of
          `POST /api/tenants` (required `name`, `contactName`, `mail`; the
          answers `400`, `409`, `429` of that operation). The body is empty —
          read the new tenant back with `GET /api/tenants/{id}`.
      "400":
        description: |
          The list breaks a shape rule (a known type twice, a title on a known
          type, `other` without one), or a medium may not be referenced —
          `media_reference_unknown` for one that is not a medium of this tenant,
          `media_reference_not_public` for an `intern` one. A creation: a
          missing or invalid contact field (see `POST /api/tenants`). An update
          of an existing tenant needs no contact fields.
      "403":
        description: Neither owner of the tenant named by `id` nor instance owner, or no right to pick the medium
      "409":
        description: "A creation: `max_tenants_reached`"
      "429":
        description: "A creation: `too_many_requests` with `Retry-After`"

  get:
    tags:
      - Tenants
    summary: List the tenants the caller owns, legal documents included
    description: |
      Every tenant the caller owns, read the same way as a single one — each
      media reference of the legal documents carries the address it resolves
      to. A declined tenant (glossary "abgewiesen") is not in it: its owner's
      membership rests (glossary "Ruhende Mitgliedschaft") and it appears to
      them, as to every member, in the public export only. With `publicTenants=true` the list switches to the public tenant
      export, which does not carry legal documents at all, but `accessApps`:
      the customer-service contact of every active access application that
      has one, and nothing else of the application. The full export carries the
      supervision level (`supervisionLevel`), `supervisionChangedAt` and
      `supervisionReason` (the reason of the latest level change, `null`
      without one), the public one none of them; `?supervisionLevel=` narrows
      the list to one level (a tenant without a stored level counts as `free`).
    security:
      - bearerAuth: []
    parameters:
      - name: publicTenants
        in: query
        required: false
        schema:
          type: boolean
        description: Return the public export instead, without legal documents
      - name: supervisionLevel
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/SupervisionLevel"
        description: Only the tenants at this supervision level
    responses:
      "200":
        description: The tenants
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  legalDocuments:
                    $ref: "#/components/schemas/TenantLegalDocuments"
                  accessApps:
                    type: array
                    description: Public export only - the customer-service contacts of the active access applications
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: ifbs
                        customerService:
                          type: object
                          properties:
                            name:
                              type: string
                            phone:
                              type: string
                            email:
                              type: string
      "400":
        description: "`invalid_supervision_level`: a level outside the vocabulary"

/api/tenants/{id}:
  get:
    tags:
      - Tenants
    summary: Read a tenant, legal documents included
    description: |
      Reads the whole tenant for its owner. Every media reference of the legal
      documents carries the address it resolves to; nothing is normalised on the
      way in, only on the way out. The answer carries `supervisionLevel`,
      `supervisionChangedAt` and `supervisionReason`.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: tenant1
    responses:
      "200":
        description: The tenant
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                legalDocuments:
                  $ref: "#/components/schemas/TenantLegalDocuments"
                supervisionLevel:
                  $ref: "#/components/schemas/SupervisionLevel"
                supervisionChangedAt:
                  type: string
                  format: date-time
                  nullable: true
                supervisionReason:
                  type: string
                  nullable: true
      "403":
        description: |
          Neither tenant owner nor instance owner (`forbidden`), or the owner
          of a declined tenant: `tenant_declined` with `params: { tenantId,
          supervisionLevel, supervisionChangedAt, supervisionReason }`
          (`TenantDeclinedError`).

/api/tenants/{tenant}/readiness:
  get:
    tags:
      - Tenants
    summary: The readiness check of a tenant
    description: |
      The readiness check (glossary „Bereitschafts-Check“) of the tenant: a
      non-binding account of what its current configuration still lacks for a
      public appearance, computed from the current data on every call and never
      stored. The tenant owner and the instance owner get the same answer.
      „Fulfilled“ confirms configuration, not that payment or mail actually
      work; no test mail, test payment or reachability test is run, and the
      check is no gate for the supervision level or for submitting an offer.

      Criteria, in order: `contact` (name, contact person, formally valid mail;
      phone, website and address optional), `legal` (always `not_required`),
      `offers` (at least one bookable or ongoing/upcoming event with the
      publication wish `isPublic`), `schedule` (every such offer has a valid
      period, or - for a bookable - entries behind each enabled time
      restriction), `payment` (every such paid platform offer has an active and
      completely configured payment app; the invoice counts; free and
      externally booked events need none; a dynamic external price counts as
      paid), `mail` (mail switched on for the instance and the transport the
      tenant's mails take complete; `transport` names it, never a credential).
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
        example: tenant1
    responses:
      "200":
        description: The check
        content:
          application/json:
            schema:
              type: object
              required: [checkedAt, criteria]
              properties:
                checkedAt:
                  type: string
                  format: date-time
                criteria:
                  type: array
                  items:
                    type: object
                    required: [key, state, hint, offers]
                    properties:
                      key:
                        type: string
                        enum: [contact, legal, offers, schedule, payment, mail]
                      state:
                        type: string
                        enum: [fulfilled, missing, not_required]
                      hint:
                        type: string
                        description: User-facing explanation (German)
                      offers:
                        type: array
                        description: The offers the item concerns
                        items:
                          type: object
                          properties:
                            offerType:
                              type: string
                              enum: [bookable, event]
                            offerId:
                              type: string
                            title:
                              type: string
                      transport:
                        type: string
                        nullable: true
                        enum: [tenant, instance]
                        description: |
                          `mail` only - the transport the tenant's mails take;
                          `null` while the instance has mail switched off
      "401":
        description: Not signed in
      "403":
        description: Neither owner of this tenant nor instance owner
      "404":
        description: "Unknown tenant (`code: tenant_not_found`)"
