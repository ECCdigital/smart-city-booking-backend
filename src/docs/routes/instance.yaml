# swagger/routes/instance.yaml
#
# The instance, as far as the tenant supervision and the public consumers
# read and write it: the initial supervision level (glossary "Startstufe") a
# self-created tenant starts at, and whether everyone may create a tenant.
# The other instance fields travel with the same routes and are not
# described here. Besides: „Realm prüfen“, the check of the stored Keycloak
# realm (ECCdigital/tickets#80).

/api/instances/public:
  get:
    tags:
      - Instance
    summary: The public instance
    description: |
      The instance without its private data (mail transport, owners, the
      tenant creation allow-list, instance custom fields). Carries
      `tenantInitialSupervisionLevel`, so a frontend can tell a user what a
      new tenant starts at before it is created, and
      `allowAllUsersToCreateTenant`, so a storefront can show its "offer
      spaces" entry to a visitor who is not signed in.
    responses:
      "200":
        description: The public instance.
        content:
          application/json:
            schema:
              type: object
              properties:
                allowAllUsersToCreateTenant:
                  type: boolean
                  description: |
                    `true` when every signed-in user may create a tenant.
                    The allow-list (`allowedUsersToCreateTenant`) is not
                    part of the public instance.
                tenantInitialSupervisionLevel:
                  $ref: "#/components/schemas/TenantInitialSupervisionLevel"

/api/instances:
  get:
    tags:
      - Instance
    summary: The instance
    description: The whole instance. Instance owner only.
    security:
      - bearerAuth: []
    responses:
      "200":
        description: The instance, `tenantInitialSupervisionLevel` included.
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantInitialSupervisionLevel:
                  $ref: "#/components/schemas/TenantInitialSupervisionLevel"
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner
  put:
    tags:
      - Instance
    summary: Store the instance
    description: |
      Stores the instance. Instance owner only. The body is stored as the
      whole instance, so it has to name at least one instance owner in
      `ownerUserIds`. `tenantInitialSupervisionLevel`
      is validated against the three levels; a body that does not name it
      keeps the stored one. Changing it is never retroactive: no existing
      tenant changes its level, and nothing promotes a tenant automatically.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - ownerUserIds
            properties:
              ownerUserIds:
                type: array
                minItems: 1
                items:
                  type: string
                description: The instance owners; never empty.
              tenantInitialSupervisionLevel:
                $ref: "#/components/schemas/TenantInitialSupervisionLevel"
    responses:
      "200":
        description: The stored instance.
      "400":
        description: |
          `instance_owners_required` with `params: { field: "ownerUserIds" }`
          for a body without `ownerUserIds` or with an empty list; nothing is
          stored. `invalid_supervision_level` with `params: { field, level, allowed }`
          for a `tenantInitialSupervisionLevel` outside the initial levels
          (`allowed: [free, supervised, pending]`; `declined`, `null` and `""`
          included); `validation_failed` for the other fields.
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner

/api/instances/keycloak/check:
  post:
    tags:
      - Instance
    summary: Check the stored Keycloak realm („Realm prüfen“)
    description: |
      Checks the stored Keycloak realm from outside, without the Admin API,
      and answers one row per requirement of the Admin UI's setup guide
      (tab „Single Sign-On“). Instance owner only (`instance.checkRealm`).

      Requests go only to the stored Keycloak-URL
      (`<serverUrl>/realms/<realm>/…`) and the stored Portal-URL
      (`<portal origin>/api/auth/sso/login`, the Storefront's sign-in); values
      of the body only go to Keycloak as query or form parameters and as
      the `Origin` header. Every probe waits 5 s at most and follows no
      redirect; only status code, `Location`, JSON `error` codes and
      `Access-Control-Allow-Origin` are evaluated, never page text. The
      stored values are read fresh, also while Keycloak is not active.
      Nothing is stored.

      Rows present, ascending by id: 1 (realm and issuer), 2 (Web-Client),
      3 (PKCE S256 enforced), 4 (Valid Redirect URIs), 5 (Valid Post Logout
      Redirect URIs), 6 (Web Origins, only in `direct` mode), 7 (API
      client), 8 (audience), 9 (client roles, only while the stored role
      mapping is active), 10 (Portal-URL). Rows 4, 5 and 6 are left out
      when the body gives nothing to probe for them: no redirect URI, no
      post logout redirect URI, no `adminUi` entry. Only row 6 sends an
      `Origin`. Rows 8 and 9 read the request's access token when the
      owner signed in via SSO through the web client of the stored realm
      (its `iss` the stored issuer); row 8 introspects it as the API
      client. A token of another realm is never sent anywhere. When row 1
      is not `ok`, every other row is `na`
      with `realm_unavailable`. The backend sends codes, never prose: the
      Admin UI formulates every sentence from `reason` and `details`.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/KeycloakCheckRequest"
    responses:
      "200":
        description: The rows, ascending by id.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeycloakCheckResult"
      "400":
        description: |
          `ValidationError` (`message: validation_failed`, `details[]` with
          `field` as a JSON path into the body and `code` one of `required`,
          `invalid_enum`, `invalid_type_array`, `invalid_type_string`,
          `invalid_format`, `max_items`, `max_length`) for a body that breaks
          the rules of `KeycloakCheckRequest`; `BadRequestError` with
          `code: keycloak_settings_missing` and
          `params.missing` (of `serverUrl`, `realm`, `publicClient`,
          `privateClient`, `privateClientSecret`) when a stored value is
          empty.
      "401":
        description: Not authenticated
      "403":
        description: Not the instance owner

components:
  schemas:
    KeycloakCheckRequest:
      type: object
      required: [mode, apps]
      description: |
        The mode and the addresses the setup guide shows. Every string at
        most 2048 characters.
      properties:
        mode:
          type: string
          enum: [bff, direct]
        apps:
          type: array
          maxItems: 10
          description: |
            One entry per origin; `adminUi` one or more times, `storefront`
            at most once (omitted without a Portal-URL). Entries whose
            redirect URIs the Admin UI could not determine are not sent.
          items:
            type: object
            required: [app, origin, redirectUris, postLogoutRedirectUris]
            properties:
              app:
                type: string
                enum: [adminUi, storefront]
              origin:
                type: string
                description: An absolute http(s) origin, no path.
                example: https://booking.example.de
              redirectUris:
                type: array
                maxItems: 10
                items:
                  type: string
                  description: An absolute http(s) URL.
                example:
                  ["https://booking.example.de/admin/api/auth/sso/callback"]
              postLogoutRedirectUris:
                type: array
                maxItems: 10
                items:
                  type: string
                  description: |
                    An absolute http(s) URL; only the entry of „Benutzer
                    wechseln“ ends in `*`.
                example:
                  - https://booking.example.de/admin/login
                  - https://booking.example.de/admin/api/auth/sso/login*

    KeycloakCheckResult:
      type: object
      properties:
        checkedAt:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: "#/components/schemas/KeycloakCheckRow"

    KeycloakCheckStatus:
      type: string
      enum: [ok, fail, na, info]
      description: |
        `ok` erfüllt, `fail` nicht erfüllt, `na` nicht prüfbar, `info`
        Information.

    KeycloakCheckRow:
      type: object
      required: [id, status, reason]
      description: |
        A row with `parts` carries the worst part status (`fail` > `na` >
        `info` > `ok`) and the reason of the first part with that status.
        `details` is absent when there is nothing to say.
      properties:
        id:
          type: integer
          description: The requirement, 1 (realm and issuer) to 10.
          example: 1
        status:
          $ref: "#/components/schemas/KeycloakCheckStatus"
        reason:
          type: string
          description: |
            Row 1: `issuer_matches` (`details: { issuer }`),
            `realm_not_found` (`{ httpStatus: 404, url }`),
            `issuer_mismatch` (`{ expected, actual }`).
            Row 2, part `token`: `client_public`,
            `client_unknown_or_disabled` (`{ httpStatus: 401, error:
            invalid_client }`), `client_authentication_on` (`{ httpStatus:
            401, error: unauthorized_client }`); part `authorize`, with the
            first redirect URI row 4 accepted: `standard_flow_on`,
            `standard_flow_off` (`{ error: unauthorized_client }`).
            Row 3, parts `without_challenge`: `pkce_required`,
            `pkce_optional`; `plain`: `pkce_plain_rejected`,
            `pkce_plain_accepted`.
            Row 2 `authorize` and row 3, always `na`:
            `no_redirect_uri_accepted` (row 4 accepted none),
            `web_client_invalid`; row 3 also `standard_flow_off`.
            Row 4, one part per redirect URI: `redirect_uri_accepted`,
            `redirect_uri_rejected` (`{ httpStatus: 400 }`),
            `http_accepted` (`{ uri }`, the `http` variant).
            Row 5, one part per post logout redirect URI as sent:
            `post_logout_redirect_accepted`, `post_logout_redirect_rejected`
            (`{ httpStatus: 400 }`).
            Row 6, one part per `adminUi` origin: `origin_allowed`,
            `origin_not_allowed` (`{ httpStatus }`, 403 or 400).
            Rows 4, 5 and 6, always `na`: `web_client_invalid` (row 2's
            `token` part found the Web-Client unknown or disabled; for row 6
            also any other than `client_public`, or a `401` with
            `{ httpStatus, error? }`).
            Row 7 (API client may introspect): `introspection_allowed`,
            `api_client_secret_wrong`, `api_client_unknown_or_disabled`,
            `introspection_unauthorized` (`{ httpStatus: 401 }`),
            `api_client_public` (`{ httpStatus: 403 }`).
            Row 8 (audience, from the request's access token of an SSO
            sign-in via the web client; `aud` always as an array):
            `audience_present` (`{ aud }`), `audience_missing` (`{ aud }`),
            `sso_login_required`, `token_other_realm` (`{ iss }`, the
            token's issuer is not the stored one), `token_other_client`
            (`{ azp }`), `token_inactive` (`{ aud }`), `api_client_invalid`
            (row 7 is not `ok`; before the token is read).
            Row 9 (client roles, only while the role mapping is active):
            `client_roles` (`info`, `{ roles }`), `sso_login_required`,
            `token_other_realm` (`{ iss }`), `token_other_client`
            (`{ azp }`).
            Row 10 (the `redirect_uri` of the Storefront's SSO sign-in held
            against the storefront's first `redirectUris` entry):
            `storefront_redirect_matches` (`ok`, `{ expected, actual }`),
            `storefront_origin_mismatch` (`fail`, `{ expected, actual }`,
            another origin), `storefront_path_mismatch` (`na`,
            `{ expected, actual }`, same origin, other path or query),
            `storefront_not_redirecting` (`na`, `{ httpStatus, location? }`,
            no redirect to the stored realm's authorize endpoint),
            `portal_url_missing` (`na`, no stored Portal-URL or no
            storefront entry in the body).
            Any row or part, always `na`: `unexpected_response`
            (`{ httpStatus, error?, location? }`, `location` origin and path
            only), `timeout` (`{ url }`), `unreachable` (`{ url, code }`),
            `realm_unavailable` (row 1 is not `ok`; used for every other
            row).
          example: issuer_matches
        details:
          type: object
          additionalProperties: true
          example: { issuer: "https://sso.example.de/realms/biletado" }
        parts:
          type: array
          items:
            type: object
            required: [label, status, reason]
            properties:
              label:
                type: string
                description: What the part probed, a URI, an origin or a probe key.
              status:
                $ref: "#/components/schemas/KeycloakCheckStatus"
              reason:
                type: string
              details:
                type: object
                additionalProperties: true
