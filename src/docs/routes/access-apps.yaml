# swagger/routes/access-apps.yaml

/api/{tenant}/access-apps/{provider}/access-points:
  get:
    tags:
      - Access Apps
    summary: List the access points the provider knows for the tenant
    description: |
      The locks, doors or locker systems of the tenant's access application
      at `provider`, live from the provider's API, in the shared shape the
      access point sync stores. This is what the admin UI's access point
      picker renders when an access point is created from the provider's
      inventory.

      `supportedModes` says which access point modes the hardware really
      supports. `supportedOpenActions` says which Öffnungsarten (open
      actions) the lock can carry out; only Nuki reports it, by device type
      (a Smart Lock or Smart Door all five, a Box `auto` and `unlock`, an
      Opener `auto` alone, an unknown device type all five). Providers
      without the notion leave the field out.

      Open Locker (`open-locker`) lists the compartments the tenant's
      technical account holds a permission on - on an instance several
      tenants share, only the tenant's own -, each a door in mode `remote`
      with the compartment's UUID as `id` and `externalId`, its locker bank
      as `locationId` and the label `<locker bank> · Fach <number>`, e.g.
      „Labor Fachbank 1 · Fach 2“. `metadata` carries Open Locker's
      compartment with `number` and `lockerBank` (`id`, `name`,
      `locationDescription`).

      Requires `accessApp.read` in the tenant. A provider the tenant has no
      active application for answers `404 <provider>_application_not_found`
      (e.g. `salto_ks_application_not_found`). A provider that does not list
      access points (Pareva) answers 500, as does a provider that fails
      otherwise.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/AccessProviderParam"
    responses:
      "200":
        description: The access points of the provider
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ListedAccessPoint"
      "401":
        description: Not authenticated
      "403":
        description: Not allowed to read the tenant's access applications
      "404":
        description: |
          The tenant has no active application for the provider, code
          `<provider>_application_not_found`
      "500":
        description: Could not get access points

/api/{tenant}/access-apps/salto-ks/iqs:
  get:
    tags:
      - Access Apps
    summary: List the Salto KS IQs with their activation state
    description: |
      The IQs of the tenant's Salto site, live from the Connect API, merged
      with the local IQ activation state. This is what the IQ activation
      wizard renders. Reserved for the tenant owner, like the connection
      test (`accessApp.manage`).

      An IQ without a local activation entry is `not_activated`. Secrets and
      PINs never appear in the answer.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
    responses:
      "200":
        description: The IQs of the site
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SaltoKsIq"
      "401":
        description: Not authenticated
      "403":
        description: Not the tenant owner
      "500":
        description: Could not list Salto KS IQs

/api/{tenant}/access-apps/salto-ks/iqs/{iqId}/activation/start:
  post:
    tags:
      - Access Apps
    summary: Start the activation of an IQ
    description: |
      Fetches the single-shot first secret of the IQ (only possible while the
      system user was never activated there), stores it encrypted, and then
      asks Salto to mail the initial IQ-PIN to the system user's mailbox. The
      secret is persisted before the mail is triggered, so a lost wizard can
      be completed later with the mailed PIN.

      Called again while the activation is `pending_pin`, only the PIN mail is
      repeated - the first secret exists exactly once.

      Reserved for the tenant owner (`accessApp.manage`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/SaltoKsIqIdParam"
    responses:
      "200":
        description: The activation is waiting for the mailed PIN
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaltoKsIqActivationState"
      "400":
        description: |
          `salto_iq_activation_exists` - the IQ is already activated locally;
          discard the activation first. `salto_iq_already_activated_at_salto` -
          Salto refuses the first secret because the system user was activated
          at this IQ before (e.g. via the Salto app); this cannot be healed
          through the API - the IQ or user has to be reset on the Salto side.
      "401":
        description: Not authenticated
      "403":
        description: Not the tenant owner
      "500":
        description: Could not start Salto KS IQ activation

/api/{tenant}/access-apps/salto-ks/iqs/{iqId}/activation/complete:
  post:
    tags:
      - Access Apps
    summary: Complete the activation with the mailed PIN
    description: |
      The admin enters the PIN Salto mailed to the system user's mailbox - the
      one manual capture of the wizard. The backend activates the system user
      at the IQ with a self-computed one-time password and `delta: "0000"`, so
      the PIN stays the mailed one.

      Reserved for the tenant owner (`accessApp.manage`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/SaltoKsIqIdParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              pin:
                type: string
                description: The 4-digit IQ-PIN from the mail
                example: "1234"
            required:
              - pin
    responses:
      "200":
        description: The IQ is activated for remote open
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaltoKsIqActivationState"
      "400":
        description: |
          `salto_iq_invalid_pin` - the pin is not four digits.
          `salto_iq_activation_not_started` - there is no stored secret to
          complete with. `salto_iq_activation_otp_rejected` - Salto refused
          the one-time password; the activation stays `pending_pin` so the
          step can be retried with the right PIN.
      "401":
        description: Not authenticated
      "403":
        description: Not the tenant owner
      "500":
        description: Could not complete Salto KS IQ activation

/api/{tenant}/access-apps/salto-ks/iqs/{iqId}/activation:
  delete:
    tags:
      - Access Apps
    summary: Discard the local activation of an IQ
    description: |
      Removes the locally stored activation entry - the IQ is `not_activated`
      again. Calls nothing at Salto. This is the first step of a
      re-activation after an IQ reset, an IQ swap or a dead activation.

      Reserved for the tenant owner (`accessApp.manage`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/SaltoKsIqIdParam"
    responses:
      "200":
        description: The local entry is gone
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaltoKsIqActivationState"
      "401":
        description: Not authenticated
      "403":
        description: Not the tenant owner
      "500":
        description: Could not discard Salto KS IQ activation

/api/{tenant}/access-apps/{provider}:
  put:
    tags:
      - Access Apps
    summary: Save the access application of one provider
    description: |
      Creates or changes the tenant's access application (glossary
      „Anbindung“) of `provider` and nothing else: payment, sign-in and the
      other providers' applications stay as stored. A new application is
      switched on; a stored one keeps `active` - switching is
      `PUT …/{provider}/active`. A field the body leaves out stays as stored,
      and so does a secret the body leaves empty or out: the admin form
      never sees a stored secret. Backend-owned state (the Salto KS IQ
      activations) is not the body's to write.

      The answer is the saved application without its secrets;
      `storedSecrets` says per secret field whether one is stored. Which
      fields are secrets is the provider's to say: `nuki` `apiToken`,
      `salto-ks` `clientSecret` and `password`, `open-locker` `password`,
      `ifbs` `apiKey` and `secretPhrase`, `pareva` `password`.

      `GET` and `PUT /api/tenants` are unchanged: they still read and write
      the access applications with the whole tenant.

      Reserved for the tenant owner, like the connection test
      (`accessApp.manage`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/AccessProviderParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            description: |
              The provider's fields as the admin form holds them, e.g. for
              `nuki` `apiToken`, `apiBaseUrl` and `customerService`. `type`,
              `id` and `active` are ignored.
          example:
            apiToken: ""
            apiBaseUrl: https://api.nuki.io
    responses:
      "200":
        description: The saved application, without secrets
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessApplicationWithoutSecrets"
      "401":
        description: Not authenticated
      "403":
        description: Not the tenant owner
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessAppError"
      "404":
        description: |
          `access_provider_not_found` - there is no such provider.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessAppError"
  delete:
    tags:
      - Access Apps
    summary: Remove the access application of one provider
    description: |
      Removes the tenant's access application of `provider` with its
      credentials, and nothing else of the tenant. Not while the provider
      still has access points - they would be left without the credentials
      they open with: delete them first.

      Reserved for the tenant owner (`accessApp.manage`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/AccessProviderParam"
    responses:
      "204":
        description: The application is removed
      "401":
        description: Not authenticated
      "403":
        description: Not the tenant owner
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessAppError"
      "404":
        description: |
          `access_provider_not_found` - there is no such provider.
          `access_app_not_found` - the tenant has no application of it.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessAppError"
      "409":
        description: |
          `access_app_has_access_points` - the provider still has access
          points; `params` names `provider` and the number of
          `accessPoints`.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessAppError"
            example:
              error: ConflictError
              code: access_app_has_access_points
              statusCode: 409
              params:
                provider: nuki
                accessPoints: 3

/api/{tenant}/access-apps/{provider}/active:
  put:
    tags:
      - Access Apps
    summary: Switch the access application of one provider on or off
    description: |
      Sets `active` of the tenant's access application of `provider` and
      changes nothing else. Switched off, the application keeps its
      credentials, its access points and their assignment to bookables, so
      switching it on again needs no new setup.

      Reserved for the tenant owner (`accessApp.manage`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/AccessProviderParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - active
            properties:
              active:
                type: boolean
    responses:
      "200":
        description: The application, without secrets
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessApplicationWithoutSecrets"
      "400":
        description: "`access_app_active_invalid` - `active` is not a boolean"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessAppError"
      "401":
        description: Not authenticated
      "403":
        description: Not the tenant owner
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessAppError"
      "404":
        description: |
          `access_provider_not_found` - there is no such provider.
          `access_app_not_found` - the tenant has no application of it.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessAppError"

/api/{tenant}/access-apps/{provider}/test:
  post:
    tags:
      - Access Apps
    summary: Test the connection to an access provider
    description: |
      Tests the configuration in the body, as the admin form holds it, against
      the provider; nothing is stored. Reserved for the tenant owner
      (`accessApp.manage`).

      For `salto-ks` a secret left empty or out is taken from the tenant's
      stored Salto KS application, but only while it belongs to what the body
      names: the client secret while `clientId` and `environment` are the
      stored ones, the password while `username` and `environment` are. The
      site plays no part. Only then are the required fields checked. A secret
      that is still missing stops the test before Salto is asked, with
      `code: "missing_secret"` and the reason per secret.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/AccessProviderParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            description: |
              The provider's credentials. `salto-ks`: `clientId`,
              `clientSecret`, `siteId`, `environment`, `username`, `password`.
    responses:
      "200":
        description: |
          The outcome of the test, also when it failed. `salto-ks` adds
          `checks`, `testedWith`, `testedAt` and `environment` to every test
          it ran, and `details` to a working connection.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessConnectionTestResult"
      "400":
        description: No test available for the provider
      "401":
        description: Not authenticated
      "403":
        description: Not the tenant owner
      "500":
        description: Could not test access connection

components:
  schemas:
    AccessApplicationWithoutSecrets:
      type: object
      description: |
        An access application of the tenant as it leaves through the API:
        the provider's fields without its secrets and without backend-owned
        state. `storedSecrets` says per secret field whether one is stored.
      required:
        - type
        - id
        - active
        - storedSecrets
      properties:
        type:
          type: string
          enum: [access]
        id:
          type: string
          description: The provider, e.g. `nuki`
        active:
          type: boolean
        storedSecrets:
          type: object
          additionalProperties:
            type: boolean
          example:
            apiToken: true
      additionalProperties: true
      example:
        type: access
        id: nuki
        active: true
        title: ""
        apiBaseUrl: https://api.nuki.io
        customerService: null
        storedSecrets:
          apiToken: true

    AccessAppError:
      type: object
      description: The one JSON form of the central error handler
      properties:
        error:
          type: string
          example: NotFoundError
        code:
          type: string
          example: access_app_not_found
        statusCode:
          type: integer
          example: 404
        params:
          type: object
          additionalProperties: true

    ListedAccessPoint:
      type: object
      description: |
        An access point as its provider lists it - the shape the access point
        sync stores. `metadata` is the provider's own record of the lock.
      required:
        - id
        - type
        - provider
        - externalId
        - label
        - capabilities
        - supportedModes
        - metadata
      properties:
        id:
          type: string
          description: The provider's id of the access point
        type:
          type: string
          enum:
            - door
            - locker
        provider:
          type: string
          description: The access provider, e.g. `nuki`, `salto-ks`, `ifbs`
        externalId:
          type: string
          description: The id the provider addresses the lock by
        locationId:
          type: string
          nullable: true
          description: The provider's grouping of the lock (account, site, city)
        label:
          type: string
          description: The name the lock carries at the provider
        capabilities:
          type: array
          description: The point's own capabilities, e.g. `remote`, `authorization`
          items:
            type: string
        supportedModes:
          type: array
          description: The access point modes the hardware really supports
          items:
            type: string
            enum:
              - remote
              - authorization
              - both
        supportedOpenActions:
          type: array
          description: |
            The Öffnungsarten (open actions) the lock can carry out. Reported
            by Nuki only, by device type; other providers leave the field
            out. `auto` is always among them.
          items:
            type: string
            enum:
              - auto
              - unlock
              - unlatch
              - lock_n_go
              - lock_n_go_unlatch
        metadata:
          type: object
          additionalProperties: true
          description: The provider's own record of the lock

    SaltoKsIq:
      type: object
      description: One IQ of the site - live Salto flags plus the local state
      properties:
        id:
          type: string
          description: Salto IQ UUID
        customerReference:
          type: string
          description: The name of the IQ at Salto
        otpEnabled:
          type: boolean
          description: |
            Whether remote commands at this IQ demand a one-time password.
            IQs without it need no activation for remote open.
        online:
          type: boolean
          nullable: true
        restoreRequired:
          type: boolean
          description: |
            Salto reports the IQ was reset; a working activation flips to
            `reactivation_required` when this is seen.
        state:
          type: string
          description: The local activation state
          enum:
            - not_activated
            - pending_pin
            - activated
            - degraded
            - reactivation_required
        activatedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
          description: The last Salto error booked on this activation

    AccessConnectionTestResult:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        message:
          type: string
          description: What the provider answered, for the log; not a UI text
        code:
          type: string
          enum:
            - missing_fields
            - missing_secret
            - invalid_credentials
            - terms_not_accepted
            - email_not_verified
          description: |
            `missing_fields` (`salto-ks`): `clientId` or `username` is empty or
            left out; Salto was not asked. Checked before `missing_secret`.
            `missing_secret` (`salto-ks`): a secret is neither in the body nor
            stored for the identity the body names; Salto was not asked.
            `invalid_credentials` (`open-locker`): Open Locker refused the
            e-mail address or the password of the technical account.
            `terms_not_accepted` (`open-locker`): the technical account is
            blocked until it accepts Open Locker's current terms; an open
            would be refused.
            `email_not_verified` (`open-locker`): the technical account has
            not verified its e-mail address; an open would be refused.
        missing:
          type: array
          description: |
            With `missing_fields`, the required fields that are missing
            (`clientId`, `username`), named as in the request, `field` only.
            With `missing_secret`, the secrets that are missing (`clientSecret`,
            `password`), with the `reason`.
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                  - clientId
                  - clientSecret
                  - username
                  - password
              reason:
                type: string
                enum:
                  - client_id_changed
                  - username_changed
                  - environment_changed
                  - not_stored
        environment:
          type: string
          enum:
            - accept
            - production
          description: "`salto-ks`: the Salto KS environment tested"
        testedAt:
          type: string
          format: date-time
          description: "`salto-ks`: when the test ran"
        testedWith:
          type: object
          description: "`salto-ks`: where each tested secret came from"
          properties:
            clientSecret:
              $ref: "#/components/schemas/SaltoKsSecretSource"
            password:
              $ref: "#/components/schemas/SaltoKsSecretSource"
        checks:
          type: object
          description: |
            `salto-ks`: one entry per check, in the order an admin works
            through them. The first failure in `credentials`, `login` or
            `site` fails the test (`success: false`) and skips the checks
            after it. `remoteLockingRight` is always `not_verifiable`, the
            API cannot tell. `remoteAccess` and `iqs` are `unknown` when Salto
            does not answer them; the test still succeeds.
          properties:
            credentials:
              $ref: "#/components/schemas/SaltoKsConnectionCheck"
            login:
              $ref: "#/components/schemas/SaltoKsConnectionCheck"
            site:
              allOf:
                - $ref: "#/components/schemas/SaltoKsConnectionCheck"
                - type: object
                  properties:
                    locks:
                      type: integer
                      description: With `ok`, the number of locks of the site
            remoteAccess:
              $ref: "#/components/schemas/SaltoKsConnectionCheck"
            remoteLockingRight:
              $ref: "#/components/schemas/SaltoKsConnectionCheck"
            iqs:
              $ref: "#/components/schemas/SaltoKsConnectionCheck"
        details:
          type: object
          description: |
            `salto-ks` with a site: the system user's `remoteAccess`
            (`null` when Salto does not say), `remoteLockingRight` always
            `not_verifiable`, and the IQs with their activation state.
          properties:
            remoteAccess:
              type: boolean
              nullable: true
            remoteLockingRight:
              type: string
              enum:
                - not_verifiable
            iqs:
              type: array
              items:
                $ref: "#/components/schemas/SaltoKsIq"

    SaltoKsSecretSource:
      type: string
      enum:
        - stored
        - form
      description: |
        `stored`: taken from the tenant's stored application, `form`: sent in
        the body.

    SaltoKsConnectionCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - failed
            - skipped
            - unknown
            - not_verifiable
        code:
          type: string
          enum:
            - invalid_client
            - invalid_grant
            - site_forbidden
            - site_missing
            - timeout
            - remote_access_off
          description: |
            With `failed`, what Salto objected to, instead of its raw message.
            `invalid_client`: client id or client secret rejected (also those
            of the other environment). `invalid_grant`: system user or
            password rejected. `site_forbidden`: the site is not there or the
            system user may not read it. `site_missing`: no site configured.
            `timeout`: Salto did not answer in time. `remote_access_off`: the
            system user may not open remotely. A failure without code keeps
            Salto's answer in `message`.

    SaltoKsIqActivationState:
      type: object
      properties:
        iqId:
          type: string
        state:
          type: string
          enum:
            - not_activated
            - pending_pin
            - activated

  parameters:
    AccessProviderParam:
      name: provider
      in: path
      required: true
      description: The access provider id, e.g. `nuki`, `salto-ks`, `ifbs`
      schema:
        type: string

    SaltoKsIqIdParam:
      name: iqId
      in: path
      required: true
      description: Salto IQ UUID
      schema:
        type: string
