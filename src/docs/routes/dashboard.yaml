# swagger/routes/dashboard.yaml

/api/v2/dashboard/summary:
  get:
    tags:
      - Dashboard
    summary: Instance dashboard KPI summary
    description: |
      Cross-tenant Admin Dashboard KPIs for tenants the caller may access
      (instance owner: all tenants; otherwise tenant owner or `manageBookings.readAny`).
      Live Mongo aggregations with a short in-process cache (~45s TTL).
    security:
      - bearerAuth: []
    parameters:
      - name: from
        in: query
        required: false
        description: Start of time range (ISO 8601). Omit for all-time booking/revenue KPIs.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: End of time range (ISO 8601). Omit for all-time booking/revenue KPIs.
        schema:
          type: string
          format: date-time
      - name: bookableId
        in: query
        required: false
        description: Restrict bookings and revenue to this bookable.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: |
          Booking-status i18n key. Constrains booking-side KPIs only (not revenue).
        schema:
          type: string
          enum:
            - status.awaiting_approval
            - status.payment_expected
            - status.paid_completed
            - status.confirmed_without_payment
            - status.rejected
      - name: isBookable
        in: query
        required: false
        description: Filters `bookableObjects` stock only (`true`/`false`).
        schema:
          type: boolean
    responses:
      "200":
        description: Dashboard summary
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: "#/components/schemas/DashboardInstanceSummary"
      "400":
        description: Invalid query parameters
      "401":
        description: Not authenticated
      "403":
        description: Forbidden
      "500":
        description: Internal server error

/api/v2/{tenant}/dashboard/summary:
  get:
    tags:
      - Dashboard
    summary: Tenant dashboard KPI summary
    description: |
      Tenant-scoped Admin Dashboard KPIs including `byStatus`, `revenueByMonth`,
      and activity-only `byBookable` (top-N). Requires instance owner, tenant owner,
      or `manageBookings.readAny` for the tenant.
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant identifier
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: bookableId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
            - status.awaiting_approval
            - status.payment_expected
            - status.paid_completed
            - status.confirmed_without_payment
            - status.rejected
      - name: isBookable
        in: query
        required: false
        schema:
          type: boolean
      - name: byBookableLimit
        in: query
        required: false
        description: Cap for `byBookable` rows (default 100, max 500; oversize values are clamped).
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
    responses:
      "200":
        description: Tenant dashboard summary
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: "#/components/schemas/DashboardTenantSummary"
      "400":
        description: Invalid query parameters
      "401":
        description: Not authenticated
      "403":
        description: Forbidden
      "404":
        description: Tenant not found
      "500":
        description: Internal server error

components:
  schemas:
    DashboardTenantKpis:
      type: object
      properties:
        users:
          type: integer
        bookings:
          type: integer
        cancellations:
          type: integer
        bookables:
          type: integer
        bookableObjects:
          type: integer
        events:
          type: integer
        revenueEur:
          type: number
    DashboardInstanceSummary:
      type: object
      properties:
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        totals:
          allOf:
            - $ref: "#/components/schemas/DashboardTenantKpis"
            - type: object
              properties:
                tenants:
                  type: integer
        byTenant:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  tenantId:
                    type: string
                  tenantName:
                    type: string
              - $ref: "#/components/schemas/DashboardTenantKpis"
    DashboardTenantSummary:
      type: object
      properties:
        tenantId:
          type: string
        tenantName:
          type: string
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        totals:
          $ref: "#/components/schemas/DashboardTenantKpis"
        byStatus:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
        revenueByMonth:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
                example: "2026-01"
              revenueEur:
                type: number
        byBookable:
          type: array
          items:
            type: object
            properties:
              bookableId:
                type: string
              bookableTitle:
                type: string
              bookings:
                type: integer
              cancellations:
                type: integer
        byBookableHasMore:
          type: boolean
        byBookableLimit:
          type: integer
