# swagger/routes/dashboard.yaml

/api/v2/dashboard/summary:
  get:
    tags:
      - Dashboard
    summary: Instance dashboard KPI summary
    description: |
      Cross-tenant Admin Dashboard KPIs for tenants the caller may access
      (instance owner: all tenants; otherwise tenant owner or `manageBookings.readAny`).
      Live Mongo aggregations with a short in-process cache (~45s TTL).
      Always echoes `status` and `granularity`; always includes `byPeriod`
      (empty when granularity is omitted). Period keys use Europe/Berlin.
    security:
      - bearerAuth: []
    parameters:
      - name: from
        in: query
        required: false
        description: Start of time range (ISO 8601). Omit for all-time booking/revenue KPIs.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: End of time range (ISO 8601). Omit for all-time booking/revenue KPIs.
        schema:
          type: string
          format: date-time
      - name: bookableId
        in: query
        required: false
        description: Restrict bookings and revenue to this bookable.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: |
          Booking-status i18n key(s). Repeated and/or comma-separated; OR semantics.
          Constrains booking-side KPIs only (not revenue). Invalid key → 400.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
              - status.awaiting_approval
              - status.payment_expected
              - status.paid_completed
              - status.confirmed_without_payment
              - status.rejected
      - name: granularity
        in: query
        required: false
        description: |
          Dashboard Granularity for `byPeriod` (`day` | `week` | `month` | `year`).
          Omit for empty `byPeriod`. Series capped at 366 buckets (else 400).
        schema:
          type: string
          enum:
            - day
            - week
            - month
            - year
      - name: isBookable
        in: query
        required: false
        description: Filters `bookableObjects` stock only (`true`/`false`).
        schema:
          type: boolean
    responses:
      "200":
        description: Dashboard summary
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: "#/components/schemas/DashboardInstanceSummary"
      "400":
        description: Invalid query parameters
      "401":
        description: Not authenticated
      "403":
        description: Forbidden
      "500":
        description: Internal server error

/api/v2/{tenant}/dashboard/summary:
  get:
    tags:
      - Dashboard
    summary: Tenant dashboard KPI summary
    description: |
      Tenant-scoped Admin Dashboard KPIs including `byStatus`, `byPeriod`,
      and activity-only `byBookable` (top-N). Requires instance owner, tenant owner,
      or `manageBookings.readAny` for the tenant.
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        description: Tenant identifier
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: bookableId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
              - status.awaiting_approval
              - status.payment_expected
              - status.paid_completed
              - status.confirmed_without_payment
              - status.rejected
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          enum:
            - day
            - week
            - month
            - year
      - name: isBookable
        in: query
        required: false
        schema:
          type: boolean
      - name: byBookableLimit
        in: query
        required: false
        description: Cap for `byBookable` rows (default 100, max 500; oversize values are clamped).
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
    responses:
      "200":
        description: Tenant dashboard summary
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: "#/components/schemas/DashboardTenantSummary"
      "400":
        description: Invalid query parameters
      "401":
        description: Not authenticated
      "403":
        description: Forbidden
      "404":
        description: Tenant not found
      "500":
        description: Internal server error

components:
  schemas:
    DashboardPeriodBucket:
      type: object
      properties:
        period:
          type: string
          description: Europe/Berlin period key
          example: "2026-01"
        bookings:
          type: integer
        cancellations:
          type: integer
        revenueEur:
          type: number
    DashboardTenantKpis:
      type: object
      properties:
        users:
          type: integer
        bookings:
          type: integer
        cancellations:
          type: integer
        bookables:
          type: integer
        bookableObjects:
          type: integer
        events:
          type: integer
        activeEvents:
          type: integer
          description: Now-snapshot Active Event count (isEventBookable); ignores from/to
        revenueEur:
          type: number
    DashboardInstanceSummary:
      type: object
      properties:
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        status:
          type: array
          nullable: true
          items:
            type: string
          description: Echo of parsed status filter (canonical order), or null
        granularity:
          type: string
          nullable: true
          enum:
            - day
            - week
            - month
            - year
          description: Echo of Dashboard Granularity, or null when omitted
        totals:
          allOf:
            - $ref: "#/components/schemas/DashboardTenantKpis"
            - type: object
              properties:
                tenants:
                  type: integer
        byPeriod:
          type: array
          items:
            $ref: "#/components/schemas/DashboardPeriodBucket"
          description: Zero-filled series; empty when granularity is null
        byTenant:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  tenantId:
                    type: string
                  tenantName:
                    type: string
              - $ref: "#/components/schemas/DashboardTenantKpis"
    DashboardTenantSummary:
      type: object
      properties:
        tenantId:
          type: string
        tenantName:
          type: string
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        status:
          type: array
          nullable: true
          items:
            type: string
        granularity:
          type: string
          nullable: true
          enum:
            - day
            - week
            - month
            - year
        totals:
          $ref: "#/components/schemas/DashboardTenantKpis"
        byStatus:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
        byPeriod:
          type: array
          items:
            $ref: "#/components/schemas/DashboardPeriodBucket"
        byBookable:
          type: array
          items:
            type: object
            properties:
              bookableId:
                type: string
              bookableTitle:
                type: string
              bookings:
                type: integer
              cancellations:
                type: integer
        byBookableHasMore:
          type: boolean
        byBookableLimit:
          type: integer
