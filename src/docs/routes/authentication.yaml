# swagger/routes/authentication.yaml
#
# The sign-in answers, as far as the tenant supervision reaches into them:
# `permissions.tenants[]` names per tenant of the user its supervision level,
# when it last changed and the reason of that change, so the Admin UI marks a
# declined or waiting tenant before its first request. The full routes are
# described in `docs/api/authentication.md`.

/auth/signin:
  post:
    tags:
      - Authentication
    summary: Sign in with id and password
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id, password]
            properties:
              id:
                type: string
              password:
                type: string
    responses:
      "200":
        description: The user, the permissions and the tokens.
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                permissions:
                  $ref: "#/components/schemas/SignInPermissions"
                accessToken:
                  type: string
                refreshToken:
                  type: string
      "401":
        description: Wrong id or password

/auth/me:
  get:
    tags:
      - Authentication
    summary: The signed-in user and their permissions
    security:
      - bearerAuth: []
    responses:
      "200":
        description: The user and the permissions.
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                permissions:
                  $ref: "#/components/schemas/SignInPermissions"
      "401":
        description: Not authenticated

/auth/forgot-password:
  post:
    tags:
      - Authentication
    summary: Ask for a reset link by mail
    description: |
      Answers every address alike and before the mail goes out, so the answer
      does not tell whether the address has an account. An account gets at
      most 1 reset mail per minute and 5 per hour
      (`RATE_LIMIT_FORGOT_PASSWORD_PER_ACCOUNT_SHORT`, `_LONG`); past that the
      answer is the same and no mail goes out.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id:
                type: string
                description: The address
              resetUrl:
                type: string
                description: The client's own reset page, kept only on an own origin
    responses:
      "200":
        description: "`If the email exists, a reset link has been sent` (text)"
      "400":
        description: No address
      "429":
        description: |
          `too_many_requests`: 30 requests per client IP and hour
          (`RATE_LIMIT_FORGOT_PASSWORD_PER_IP`) are spent; `Retry-After`
          (seconds) and `params.retryAfterSeconds` say when the next one is
          possible.
