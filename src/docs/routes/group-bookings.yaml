/api/{tenant}/group-bookings/{groupBookingId}/commit:
  post:
    tags:
      - Group bookings
    summary: Confirm a group booking
    description: |
      Confirms every member of a requested group: a priced member awaits
      payment and the group is asked to pay once, a free member is confirmed
      and granted. Consistency validation failures return HTTP 200 with
      `success: false` (same envelope as the other group-booking mutation
      endpoints). A state write that fails at one member restores the members
      written before it.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/GroupBookingTenantParam"
      - $ref: "#/components/parameters/GroupBookingIdParam"
    responses:
      "200":
        description: |
          Group booking confirmed (`success: true`, `data` the group with its
          members) or consistency validation failed (`success: false` with
          `errors`).
      "401":
        description: Not authenticated
      "403":
        description: Missing booking management permission
      "404":
        description: Group booking not found, or a member of it
      "409":
        description: >-
          `invalid_transition` - the group is not a request any more, or its
          members differ in state (params carry `groupBookingId`, `status`,
          `transition` and the `bookingIds` concerned)
      "500":
        description: "`booking_commit_failed` - the confirmation aborted"

/api/{tenant}/group-bookings/{groupBookingId}/pay:
  post:
    tags:
      - Group bookings
    summary: Mark a group booking as paid
    description: |
      Pays every member of a group awaiting payment: the members are
      confirmed and granted one by one, one aggregated receipt is attached to
      each and the confirmation is mailed once. A state write that fails at
      one member restores the members written before it.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/GroupBookingTenantParam"
      - $ref: "#/components/parameters/GroupBookingIdParam"
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              paymentMethod:
                type: string
                description: The payment method recorded at every member
              timePaid:
                type: integer
                description: The moment of the payment as a Unix timestamp in milliseconds; now if omitted
    responses:
      "200":
        description: "Group booking paid (`success: true`, `data` the group with its members)"
      "400":
        description: >-
          `ValidationError` - a member does not pass the booking schema, so
          nothing was paid; `details` name field and code. A payment provider
          is not required of a paid booking
      "401":
        description: Not authenticated
      "403":
        description: Missing booking management permission
      "404":
        description: Group booking not found, or a member of it
      "409":
        description: >-
          `invalid_transition` - the group is not awaiting payment, or its
          members differ in state (params carry `groupBookingId`, `status`,
          `transition` and the `bookingIds` concerned)
      "500":
        description: "`set_aggregated_booking_payed_failed` - the payment aborted"

/api/{tenant}/group-bookings/{groupBookingId}/reinstate:
  post:
    tags:
      - Group bookings
    summary: Reinstate the cancelled and rejected members of a group booking
    description: |
      Brings every member of the group that is rejected or cancelled back to
      its own state of before, as the single reinstatement does: a rejected
      member to `requested`, a cancelled one to the state it was cancelled
      from; the refund audit is removed and the reason cleared. The other
      members stay as they are. Access is granted again at `confirmed`, held
      at `requested` or `payment_due`. The documents stay, no mail. A state
      write or a hold that fails restores the members written before it: the
      group stays as it was. A member whose period other bookings took in
      the meantime is answered 409 `group_booking_reinstatement_conflict`
      and nothing is reinstated, unless the body says `ignoreConflicts:
      true` (every member) or `skipConflicts: true` (only the members
      without a conflict). Needs the right to cancel a group booking.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/GroupBookingTenantParam"
      - $ref: "#/components/parameters/GroupBookingIdParam"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              ignoreConflicts:
                type: boolean
                description: Reinstate every member even where its period is taken
              skipConflicts:
                type: boolean
                description: Reinstate only the members whose period is free
    responses:
      "200":
        description: "Members reinstated (`success: true`, `data` the group with its members)"
      "401":
        description: Not authenticated
      "403":
        description: Missing group booking permission (`groupBooking.reject`)
      "404":
        description: Group booking not found, or a member of it
      "409":
        description: >-
          `invalid_transition` - no member is rejected or cancelled, or a
          cancelled one does not know what it was cancelled from; or
          `group_booking_reinstatement_conflict` - periods are taken (params
          carry `groupBookingId` and `conflicts`, one entry per member in
          conflict: `bookingId` and `conflicts` in the form of
          `booking_reinstatement_conflict`)
      "500":
        description: "`booking_reinstatement_failed` - the reinstatement aborted, the group stays as it was"

/api/{tenant}/group-bookings/{groupBookingId}:
  put:
    tags:
      - Group bookings
    summary: Save the internal comment of a group booking
    description: |
      Writes the internal comment of the group and nothing else. Any other
      field in `updateData`, a missing or empty `updateData` and a comment
      that is not a string are refused and nothing is written.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/GroupBookingTenantParam"
      - $ref: "#/components/parameters/GroupBookingIdParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - updateData
            properties:
              updateData:
                type: object
                required:
                  - internalComments
                additionalProperties: false
                properties:
                  internalComments:
                    type: string
                    description: The internal comment of the group
    responses:
      "200":
        description: The group booking with the saved comment
      "400":
        description: >-
          `invalid_group_booking_update` - `updateData` is missing, empty,
          carries another field than `internalComments`, or the comment is
          not a string (params carry `allowed`)
      "401":
        description: Not authenticated
      "403":
        description: Missing booking management permission
      "404":
        description: Group booking not found

components:
  parameters:
    GroupBookingTenantParam:
      name: tenant
      in: path
      required: true
      description: Tenant identifier
      schema:
        type: string
    GroupBookingIdParam:
      name: groupBookingId
      in: path
      required: true
      description: Group booking identifier
      schema:
        type: string

/api/{tenant}/group-bookings/booking/{bookingId}:
  get:
    tags:
      - Group bookings
    summary: The group a booking belongs to
    description: |
      The group of the booking within the reach of the request. A booking
      without a group is the common case, not a failure: it answers `200`
      with `null`, as do a group outside the reach and an unknown booking.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/GroupBookingTenantParam"
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - name: populate
        in: query
        required: false
        schema:
          type: boolean
        description: Whether the members come populated
    responses:
      "200":
        description: The group, or `null` when the booking belongs to none
      "401":
        description: Not authenticated
      "403":
        description: Missing permission to read group bookings
