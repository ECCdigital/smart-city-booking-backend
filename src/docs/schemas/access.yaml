components:
  schemas:
    OpenResult:
      type: object
      description: Result returned after triggering an access point open
      properties:
        openProcessId:
          type: string
          description: Identifier to poll the open status

    OpenStatus:
      type: object
      description: Status of a running open process
      properties:
        openProcessId:
          type: string

    AccessPoint:
      type: object
      description: An access point linked to a booking
      properties:
        id:
          type: string
        type:
          type: string
          enum: [locker, door]
        provider:
          type: string
        externalId:
          type: string
        label:
          type: string
        mode:
          type: string
          enum: [remote, authorization, both]
        capabilities:
          type: array
          description: Atomic provider capabilities detected for the access point
          items:
            type: string
            enum: [remote, authorization]
        supportedModes:
          type: array
          description: Modes that can be selected for this access point
          items:
            type: string
            enum: [remote, authorization, both]
        accessBuffer:
          $ref: "#/components/schemas/ResolvedAccessBuffer"
        accessFrom:
          type: integer
          nullable: true
          description: >
            Unix timestamp (ms) from which the access point may be operated for
            this booking (booking start minus the lead buffer).
        accessTo:
          type: integer
          nullable: true
          description: >
            Unix timestamp (ms) until which the access point may be operated for
            this booking (booking end plus the lag buffer).

    ResolvedAccessBuffer:
      type: object
      description: >
        Resolved lead/lag time (in milliseconds) around a booking during which
        the access point can still be operated. Resolved from the bookable
        configuration (`accessPointDetails.accessBuffer` as default, optionally
        overridden per access point via `points[].accessBuffer`). Both values
        default to 0 (no buffer).
      properties:
        beforeMs:
          type: integer
          minimum: 0
          description: Milliseconds before the booking start during which access is allowed
          example: 900000
        afterMs:
          type: integer
          minimum: 0
          description: Milliseconds after the booking end during which access is allowed
          example: 900000

    AccessBuffer:
      type: object
      description: >
        Lead/lag time (in minutes) around a booking during which the access
        point can still be operated. Configured on the bookable
        (`accessPointDetails.accessBuffer` as default, optionally overridden
        per access point via `points[].accessBuffer`). Both values default
        to 0 (no buffer).
      properties:
        before:
          type: integer
          minimum: 0
          description: Minutes before the booking start during which access is allowed
          example: 15
        after:
          type: integer
          minimum: 0
          description: Minutes after the booking end during which access is allowed
          example: 15
