# swagger/schemas/supervision.yaml

components:
  parameters:
    SupervisionHistoryPage:
      name: page
      in: query
      required: false
      description: 1-based page number (default 1)
      schema:
        type: integer
        minimum: 1
    SupervisionHistoryPageSize:
      name: pageSize
      in: query
      required: false
      description: Rows per page (default 50, at most 200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
    SupervisionHistoryOfferType:
      name: offerType
      in: query
      required: false
      description: Only the rows of one kind of offer
      schema:
        type: string
        enum: [bookable, event]
    SupervisionHistoryOfferId:
      name: offerId
      in: query
      required: false
      description: Only the rows of one offer
      schema:
        type: string

  schemas:
    TenantInitialSupervisionLevel:
      type: string
      enum: [free, supervised, pending]
      default: free
      description: |
        The initial supervision level of the instance (glossary
        "Startstufe"): one of the three regular levels - never `declined` -
        that every self-created tenant starts at, over
        the allow-list (`allowedUsersToCreateTenant`) and the open creation
        (`allowAllUsersToCreateTenant`) alike. Read by the server at the
        moment of the creation, never taken from a creation body; a tenant
        the instance owner creates always starts `free`. An instance
        without the field reads as `free`.
    OfferReview:
      type: object
      description: |
        The review of an offer (glossary "Prüfstatus"). Carried by the admin
        DTOs of a bookable (`GET /api/{tenant}/bookables`, `/bookables/{id}`,
        the answers of `PUT /api/{tenant}/bookables`) as `review`; never part
        of a public DTO and never taken from a store or update body.
      properties:
        status:
          type: string
          nullable: true
          enum: [pending, approved, rejected, null]
          description: "`null`: not submitted yet - which is no approval."
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: The current or last submission; a resubmission sets it anew.
        decidedAt:
          type: string
          format: date-time
          nullable: true
        decidedBy:
          type: string
          nullable: true
          description: The instance owner who decided.
        reason:
          type: string
          nullable: true
          description: Optional reason of the current decision.

    OfferReviewAnswer:
      type: object
      properties:
        offerType:
          type: string
          enum: [bookable, event]
        offerId:
          type: string
        review:
          $ref: "#/components/schemas/OfferReview"

    SupervisionLevel:
      type: string
      description: |
        The supervision level of a tenant (glossary "Aufsichtsstufe"): `free`
        works without approvals, `supervised` needs an approved review status
        per offer, `pending` (glossary "Freigabe ausstehend") has no public
        projection while everything may be prepared, `declined` (glossary
        "abgewiesen") has no public projection either - in public the two are
        the same absence. A tenant without a stored level is `free`.
      enum: [free, supervised, pending, declined]

    SupervisionHistoryRow:
      type: object
      description: One immutable row of the supervision history.
      properties:
        id:
          type: string
        tenantId:
          type: string
        offerType:
          type: string
          nullable: true
          enum: [bookable, event, null]
        offerId:
          type: string
          nullable: true
        eventType:
          type: string
          enum:
            - tenant.created
            - tenant.levelInitialized
            - tenant.levelChanged
            - review.submitted
            - review.approved
            - review.rejected
            - review.withdrawn
        occurredAt:
          type: string
          format: date-time
        actor:
          type: object
          properties:
            type:
              type: string
              enum: [user, system]
            userId:
              type: string
              nullable: true
        from:
          type: string
          nullable: true
          description: The state before (a level, or a review status).
        to:
          type: string
          nullable: true
          description: The state after.
        reason:
          type: string
          nullable: true
        origin:
          type: string
          enum: [api, migration]

    SupervisionHistoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SupervisionHistoryRow"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    ReviewQueueRow:
      type: object
      properties:
        tenantId:
          type: string
        tenantName:
          type: string
          nullable: true
        offerType:
          type: string
          enum: [bookable, event]
        offerId:
          type: string
        title:
          type: string
          nullable: true
          description: The bookable's `title`, the event's `information.name`
        submittedAt:
          type: string
          format: date-time
          description: The current submission - a resubmission renews it
        isPublic:
          type: boolean
          description: The publication wish; no filter of the queue
        adminPath:
          type: string
          nullable: true
          description: |
            The offer's editor in the Admin UI, relative to its base URL and
            to be opened in the tenant `tenantId`:
            `/<rooms|resources|tickets|event-locations>/edit?id=<offerId>`
            for a bookable (by its `type`), `/events/edit?id=<offerId>` for
            an event. `null` for a bookable of a type without an editor.
          example: /rooms/edit?id=b-123

    ReviewQueuePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewQueueRow"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    TenantApprovalQueueRow:
      type: object
      description: One waiting tenant, with what the decision needs.
      properties:
        tenantId:
          type: string
        tenantName:
          type: string
          nullable: true
        waitingSince:
          type: string
          format: date-time
          nullable: true
          description: The tenant's `supervisionChangedAt`
        contact:
          type: object
          properties:
            contactName:
              type: string
              nullable: true
            mail:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            website:
              type: string
              nullable: true
            location:
              type: string
              nullable: true
        owners:
          type: array
          description: Every owner membership of the tenant; empty without one
          items:
            type: object
            properties:
              userId:
                type: string
              displayName:
                type: string
                nullable: true
                description: The account's name; `null` without an account or a name
              mail:
                type: string
                description: The account's address (the user id)
        offerCount:
          type: integer
          description: |
            All bookables plus all events of the tenant, whatever their
            publication wish or review status
        lastChange:
          nullable: true
          description: |
            The newest history row about the tenant itself, in the shape of
            `GET /api/tenants/{tenant}/supervision/history` (`tenant.created`,
            `tenant.levelInitialized` or `tenant.levelChanged`); `null`
            without one
          allOf:
            - $ref: "#/components/schemas/SupervisionHistoryRow"

    TenantApprovalQueuePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantApprovalQueueRow"
        total:
          type: integer
          description: Every waiting tenant - the queue's counter
        page:
          type: integer
        pageSize:
          type: integer

    SupervisionNotification:
      type: object
      description: One row of the supervision notification outbox.
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - tenant.selfCreated
            - tenant.levelChanged
            - review.queueEntered
            - review.decided
        tenantId:
          type: string
        payload:
          type: object
          description: What the notice needs (old and new state, reason, offers).
        status:
          type: string
          enum: [pending, sent, failed]
        attempts:
          type: integer
          description: The dispatches of the row so far.
        lastError:
          type: string
          nullable: true
          description: Why the last dispatch failed; never carries credentials.
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        deliveries:
          type: array
          description: The mails of the row that went out; a retry leaves them out.
          items:
            type: object
            properties:
              mailType:
                type: string
              to:
                type: string
              deliveredAt:
                type: string
                format: date-time

    SupervisionNotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SupervisionNotification"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
