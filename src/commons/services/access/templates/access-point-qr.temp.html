<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>{{label}}</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        color: #111;
      }
      .sheet {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 257mm; /* A4 height minus the 10mm print margins */
        padding: 20mm;
      }
      .label {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 24px;
        word-break: break-word;
      }
      .qr {
        width: 320px;
        height: 320px;
        margin: 0 auto 24px;
      }
      .qr img {
        width: 100%;
        height: 100%;
      }
      .instruction {
        font-size: 24px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="label">{{label}}</div>
      <div class="qr">
        <img src="{{qrDataUrl}}" alt="QR-Code" />
      </div>
      <div class="instruction">{{instruction}}</div>
    </div>
  </body>
</html>
