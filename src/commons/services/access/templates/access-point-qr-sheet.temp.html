<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>QR-Codes {{label}}</title>
    <style>
      /* Etikettenbogen 2×4 of 105 × 74 mm (A7) on a borderless A4 sheet,
         e.g. Zweckform 3427. The PDF is printed without margin, so the page
         is the whole sheet. */
      @page {
        size: A4;
        margin: 0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        display: grid;
        grid-template-columns: repeat(2, 105mm);
        grid-template-rows: repeat(4, 74mm);
        align-content: center;
        overflow: hidden;
        page-break-after: always;
        break-after: page;
      }
      .page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      /* Thin dashed cut lines between the labels, for plain paper. */
      .qr-label {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 5mm 6mm;
        border-right: 0.2mm dashed #aaa;
        border-bottom: 0.2mm dashed #aaa;
      }
      .qr-label:nth-child(-n + 2) {
        border-top: 0.2mm dashed #aaa;
      }
      .qr-label:nth-child(odd) {
        border-left: 0.2mm dashed #aaa;
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 3mm;
        border-bottom: 0.3mm solid #000;
        padding-bottom: 1.5mm;
        margin-bottom: 2mm;
      }
      .locker-system {
        font-size: 9pt;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bank {
        font-size: 11pt;
        font-weight: bold;
        white-space: nowrap;
      }
      .body {
        display: flex;
        align-items: center;
        gap: 6mm;
        flex: 1;
        min-height: 0;
      }
      .qr {
        width: 52mm;
        height: 52mm;
        flex: none;
      }
      .qr svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .nrbox {
        flex: 1;
        min-width: 0;
        text-align: center;
      }
      .nrlabel {
        font-size: 12pt;
        letter-spacing: 1px;
      }
      .nr {
        font-size: 54pt;
        font-weight: bold;
        line-height: 1;
        word-break: break-all;
      }
      .off {
        font-size: 9pt;
        font-weight: bold;
        color: #b35c00;
        margin-top: 2mm;
      }
      .instr {
        font-size: 8pt;
        color: #444;
        text-align: center;
        margin-top: 1mm;
      }
    </style>
  </head>
  <body>
    {{#each pages}}
    <div class="page">
      {{#each labels}}
      <div class="qr-label">
        <div class="head">
          <span class="locker-system">{{../../label}}</span>
          <span class="bank">Schrank {{lockerBankName}}</span>
        </div>
        <div class="body">
          <div class="qr">{{{qrSvg}}}</div>
          <div class="nrbox">
            <div class="nrlabel">FACH</div>
            <div class="nr">{{number}}</div>
            {{#if outOfService}}
            <div class="off">außer Betrieb</div>
            {{/if}}
          </div>
        </div>
        <div class="instr">{{../../instruction}}</div>
      </div>
      {{/each}}
    </div>
    {{/each}}
  </body>
</html>
