<!doctype html>
<html lang="de" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
    <title>
      {{#if title}}{{title}}{{else}}KielRegion Praktikumsbörse{{/if}}
    </title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f2f6f7;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table {
        border-collapse: collapse;
      }
      .content-body a {
        color: #003064;
      }
      @media only screen and (max-width: 620px) {
        .wrap {
          width: 100% !important;
        }
        .px {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }
      }
    </style>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background: #f2f6f7;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    {{#if title}}
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        color: #f2f6f7;
        font-size: 1px;
        line-height: 1px;
      "
    >
      {{title}}
    </div>
    {{/if}}

    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f2f6f7"
    >
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table
            role="presentation"
            class="wrap"
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              width: 600px;
              max-width: 600px;
              background: #ffffff;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                align="center"
                style="background: #003064; padding: 28px 32px"
              >
                <div
                  style="
                    font-size: 22px;
                    font-weight: 700;
                    color: #ffffff;
                    letter-spacing: -0.01em;
                  "
                >
                  KielRegion <span style="color: #95c121">Praktikumsbörse</span>
                </div>
              </td>
            </tr>
            <tr>
              <td
                style="
                  height: 4px;
                  background: #95c121;
                  font-size: 0;
                  line-height: 0;
                "
              >
                &nbsp;
              </td>
            </tr>

            {{#if title}}
            <tr>
              <td class="px" style="padding: 30px 40px 0 40px">
                <h1
                  style="
                    margin: 0;
                    font-size: 20px;
                    line-height: 1.3;
                    color: #14222e;
                    font-weight: 700;
                  "
                >
                  {{title}}
                </h1>
              </td>
            </tr>
            {{/if}}

            <tr>
              <td
                class="px content-body"
                style="
                  padding: 20px 40px 32px 40px;
                  font-size: 15px;
                  line-height: 1.6;
                  color: #14222e;
                "
              >
                {{{ content }}}
              </td>
            </tr>

            <tr>
              <td
                class="px"
                style="
                  padding: 24px 40px;
                  background: #f2f6f7;
                  border-top: 1px solid #e2e7ec;
                  font-size: 12px;
                  line-height: 1.6;
                  color: #51616d;
                "
              >
                <strong style="color: #003064"
                  >KielRegion Praktikumsbörse</strong
                ><br />
                <span style="color: #8a97a0"
                  >Diese E-Mail wurde automatisch versendet – bitte antworten
                  Sie nicht direkt darauf.</span
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
