# Full-stack example: MongoDB + Backend API + Admin UI + Storefront
#
# Usage:
#   cp docker-compose.full-stack.example.yml docker-compose.yml
#   cp .env.full-stack.example .env
#   # edit secrets in .env
#   docker compose up -d --build
#
# Docs: docs/getting-started.md, for public operation docs/deployment.md
#
# Versions: all three services build from the release tags in .env
# (BACKEND_VERSION, ADMIN_UI_VERSION, STOREFRONT_VERSION). To update, change
# them there and run `docker compose up -d --build`.
#
# Data: MongoDB keeps its data in the volume mongodb_data. `docker compose
# down -v` deletes it.

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      # Creates the root account on the first start, with an empty volume
      # only. For an existing volume see docs/deployment.md
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
    # Docker publishes ports past host firewalls such as ufw: keep 27017 closed
    # to the outside in the firewall in front of the server, see
    # docs/deployment.md
    ports:
      - "27017:27017"
    networks:
      - booking-net

  backend:
    build:
      context: https://github.com/ECCdigital/smart-city-booking-backend.git#${BACKEND_VERSION:?set BACKEND_VERSION in .env}
      # Or build the local checkout:
      # context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8081"
      DB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/booking-manager?authSource=admin
      DB_NAME: booking-manager
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8081}
      # The Storefront's public URL: its reset, verify and card link pages are
      # kept only on this origin (or the Admin UI's / backend's)
      STORE_FRONT_URL: ${NUXT_PUBLIC_USER_BASE_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    networks:
      - booking-net

  admin:
    build:
      context: https://github.com/ECCdigital/smart-city-booking-vue-app.git#${ADMIN_UI_VERSION:?set ADMIN_UI_VERSION in .env}
    restart: unless-stopped
    environment:
      VUE_APP_SERVER_BASE_URL: ${BACKEND_URL:-http://localhost:8081}
      VUE_APP_NAME: ${VUE_APP_NAME:-Smart City Booking}
      VUE_APP_IS_PRODUCTION: ${VUE_APP_IS_PRODUCTION:-true}
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - booking-net

  storefront:
    build:
      context: https://github.com/ECCdigital/smart-city-booking-store-front.git#${STOREFRONT_VERSION:?set STOREFRONT_VERSION in .env}
    restart: unless-stopped
    environment:
      # Server-side BFF → backend on the Docker network (not localhost:8080)
      NUXT_API_BASE_URL: http://backend:8081
      NUXT_USER_BASE_URL: ${NUXT_USER_BASE_URL:-http://localhost:3000}
      NUXT_PUBLIC_USER_BASE_URL: ${NUXT_PUBLIC_USER_BASE_URL:-http://localhost:3000}
      NUXT_ADMIN_BASE_URL: ${FRONTEND_URL:-http://localhost:8080}
      NUXT_PUBLIC_ADMIN_BASE_URL: ${FRONTEND_URL:-http://localhost:8080}
      NUXT_CACHE_ENABLED: ${NUXT_CACHE_ENABLED:-false}
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - booking-net

networks:
  booking-net:
    driver: bridge

volumes:
  mongodb_data:
